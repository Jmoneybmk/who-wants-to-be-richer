/* ---------- UTILITIES ---------- */
function escapeHtml(s) { if (typeof s !== 'string') return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s) { return escapeHtml(s); }

/* ---------- EVENTS ---------- */
function attachEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    if (action === 'player-name' || action === 'roster-name') {
      el.addEventListener('input', handleInput);
    } else if (action === 'roster-source' || action === 'roster-viewer') {
      el.addEventListener('change', handleRosterChange);
    } else {
      el.addEventListener('click', handleAction);
    }
  });
}

function handleRosterChange(e) {
  const action = e.currentTarget.dataset.action;
  const slot = parseInt(e.currentTarget.dataset.slot, 10);
  if (action === 'roster-source') {
    state.roster[slot].source = e.currentTarget.value;
    if (state.roster[slot].source === 'local') state.roster[slot].viewerId = null;
    if (state.roster[slot].source === 'viewer') state.roster[slot].name = '';
    render();
  } else if (action === 'roster-viewer') {
    state.roster[slot].viewerId = e.currentTarget.value || null;
    render();
  }
}

function handleInput(e) {
  const action = e.currentTarget.dataset.action;
  const idx = parseInt(e.currentTarget.dataset.idx || e.currentTarget.dataset.slot, 10);
  if (action === 'roster-name') {
    state.roster[idx].name = e.currentTarget.value;
    // Update Start button without full re-render
    const confirmBtn = document.querySelector('[data-action="roster-confirm"]');
    if (confirmBtn) {
      const valid = state.roster.every(s => {
        if (s.source === 'local') return s.name && s.name.trim().length > 0;
        if (s.source === 'viewer') return !!s.viewerId;
        return false;
      });
      if (valid) confirmBtn.removeAttribute('disabled');
      else confirmBtn.setAttribute('disabled', '');
    }
  } else {
    // Legacy player-name input from teamSetup
    state.setupPlayers[idx] = e.currentTarget.value;
    const confirmBtn = document.querySelector('[data-action="confirm-team-setup"]');
    if (confirmBtn) {
      const canStart = state.setupPlayers.every(n => n.trim().length > 0);
      if (canStart) confirmBtn.removeAttribute('disabled');
      else confirmBtn.setAttribute('disabled', '');
    }
  }
}

function fullCleanup() {
  stopTimer();
  stopSpeaking();
  audio.stopBGM();
  if (lifelineIntervalId) { clearInterval(lifelineIntervalId); lifelineIntervalId = null; }
  if (audienceIntervalId) { clearInterval(audienceIntervalId); audienceIntervalId = null; }
  try { if (state.lifelineActiveTab && !state.lifelineActiveTab.closed) state.lifelineActiveTab.close(); } catch (e) {}
  state.lifelineActiveTab = null;
  state.lifelineActiveType = null;
  state.lifelineRemaining = 0;
  state.confirmingFinal = false;
  state.lifelineEnded = false;
  state.continuePrompt = false;
  state.audienceActive = false;
  state.showReplaceModal = false;
  state.replaceTargetSlot = null;
  // Reset room back to lobby phase (keep the room alive for next game)
  if (state.roomId && window.firebaseSync) {
    window.firebaseSync.setMeta({ phase: 'lobby', mode: null, theme: null });
    // Clear all viewer roles back to unassigned
    Object.keys(state.lobbyViewers || {}).forEach(vid => {
      const v = state.lobbyViewers[vid];
      if (v.isLocal) return;
      window.firebaseSync.setViewerRole(vid, 'unassigned', null, null);
    });
    // Clear any audience state
    window.firebaseSync.setAudience({ active: false });
    // Clear game state
    window.firebaseSync.setGameState(null);
  }
}

function handleAction(e) {
  const btn = e.currentTarget;
  const action = btn.dataset.action;
  const idx = btn.dataset.idx ? parseInt(btn.dataset.idx, 10) : null;

  if (!audio.initialized) audio.init();
  audio.unlock();

  const noClick = new Set(['answer','lifeline-fifty','lifeline-google','lifeline-ai','lifeline-audience','open-final-confirm','confirm-yes','confirm-no','toggle-voice','toggle-audio','toggle-safety','cancel-lifeline','continue-yes','continue-walk','close-audience','player-name','set-player-count']);
  if (!noClick.has(action)) audio.click();

  switch (action) {
    case 'play': state.screen = 'modeSelect'; render(); break;
    case 'mode-single': state.mode = 'single'; state.screen = 'themeSelect'; render(); break;
    case 'mode-host': state.mode = 'host'; state.screen = 'themeSelect'; render(); break;
    case 'mode-coop': state.mode = 'coop'; state.setupPlayerCount = 2; state.screen = 'themeSelect'; render(); break;
    case 'mode-versus': state.mode = 'versus'; state.setupPlayerCount = 2; state.screen = 'themeSelect'; render(); break;
    case 'mode-select': state.screen = 'modeSelect'; render(); break;
    case 'set-player-count':
      const n = parseInt(btn.dataset.n, 10);
      state.setupPlayerCount = n;
      while (state.setupPlayers.length < n) state.setupPlayers.push('');
      while (state.setupPlayers.length > n) state.setupPlayers.pop();
      render();
      break;
    case 'confirm-team-setup':
      state.screen = 'themeSelect';
      render();
      break;
    case 'toggle-safety':
      state.safetyNetsEnabled = !state.safetyNetsEnabled;
      render();
      break;
    case 'theme':
      state.theme = btn.dataset.theme;
      state.roster = [];
      if (state.mode === 'single') state.setupPlayerCount = 1;
      else if (!state.setupPlayerCount || state.setupPlayerCount < 2) state.setupPlayerCount = 2;
      state.screen = 'roster';
      render();
      break;
    case 'theme-select-back':
      state.screen = 'themeSelect';
      render();
      break;
    case 'roster-set-count':
      const newCount = parseInt(btn.dataset.n, 10);
      state.setupPlayerCount = newCount;
      while (state.roster.length > newCount) state.roster.pop();
      render();
      break;
    case 'roster-confirm':
      const rosterOpts = {
        safetyNetsEnabled: state.safetyNetsEnabled,
        roster: state.roster.map((r, i) => ({
          source: r.source,
          viewerId: r.source === 'viewer' ? r.viewerId : null,
          name: r.source === 'local' ? r.name.trim() : (state.lobbyViewers[r.viewerId] ? state.lobbyViewers[r.viewerId].name : ('Player ' + (i+1))),
          slot: i
        }))
      };
      if (state.roomId && window.firebaseSync) {
        Object.keys(state.lobbyViewers).forEach(vid => {
          const v = state.lobbyViewers[vid];
          if (v.isLocal) return;
          const assignedSlot = rosterOpts.roster.findIndex(r => r.viewerId === vid);
          if (assignedSlot >= 0) window.firebaseSync.setViewerRole(vid, 'player', assignedSlot, null);
          else window.firebaseSync.setViewerRole(vid, 'audience', null, null);
        });
      }
      startNewGame(state.mode, state.theme, rosterOpts);
      break;
    case 'continue': resumeSavedGame(); break;
    case 'scores': state.screen = 'scores'; render(); break;
    case 'settings': state.screen = 'settings'; render(); break;
    case 'back-menu': state.screen = 'menu'; checkSavedGame().then(render); break;

    case 'answer':
      if (state.mode === 'host') hostForceSelect(idx);
      else selectAnswer(idx);
      break;
    case 'open-final-confirm': openFinalConfirm(); break;
    case 'confirm-yes': confirmYes(); break;
    case 'confirm-no': confirmNo(); break;
    case 'walk-away': walkAway(); break;
    case 'continue-yes': continueChosen(); break;
    case 'continue-walk': walkAwayChosen(); break;

    case 'lifeline-fifty': useFiftyFifty(); break;
    case 'lifeline-google': useGoogleSearch(); break;
    case 'lifeline-ai': useAskAI(); break;
    case 'lifeline-audience': useAudience(); break;
    case 'cancel-lifeline': cancelLifelineEarly(); break;
    case 'resume-after-lifeline': resumeAfterLifeline(); break;
    case 'close-audience': closeAudience(); break;

    case 'quit':
      if (confirm('Quit current game?')) { fullCleanup(); state.screen = 'menu'; checkSavedGame().then(render); }
      break;
    case 'play-again':
      const replayOpts = { safetyNetsEnabled: state.safetyNetsEnabled };
      if (isTeamMode()) replayOpts.players = state.players.map(p => p.name);
      startNewGame(state.mode, state.theme, replayOpts);
      break;
    case 'main-menu': fullCleanup(); state.screen = 'menu'; checkSavedGame().then(render); break;
    case 'toggle-voice': state.voiceEnabled = !state.voiceEnabled; if (!state.voiceEnabled) stopSpeaking(); saveSettings(); render(); break;
    case 'toggle-audio': state.audioEnabled = !state.audioEnabled; audio.setEnabled(state.audioEnabled); if (state.audioEnabled && state.screen === 'game') audio.startBGM(); saveSettings(); render(); break;

    case 'host-start': startTimer(); break;
    case 'host-pause': pauseTimer(); break;
    case 'host-resume': resumeTimer(); break;
    case 'host-reset': stopTimer(); state.timerRemaining = TIMER_FOR_TIER(state.currentTier); render(); break;
    case 'host-adjust-plus': adjustTimer(10); break;
    case 'host-adjust-minus': adjustTimer(-10); break;
    case 'host-confirm': hostConfirm(); break;
    case 'host-correct': hostMarkCorrect(); break;
    case 'host-wrong': hostMarkWrong(); break;
    case 'host-skip': loadQuestionForCurrentTier(false); break;
    case 'host-end': if (confirm('End the game now?')) endGame(false, 'walkaway'); break;

    case 'open-replace':
      state.replaceTargetSlot = parseInt(btn.dataset.slot, 10);
      state.showReplaceModal = true;
      // Pause timer while replacing
      state.timerPaused = true;
      render();
      break;
    case 'cancel-replace':
      state.showReplaceModal = false;
      state.replaceTargetSlot = null;
      // Resume timer
      if (state.timerRunning) state.timerPaused = false;
      render();
      break;
    case 'do-replace':
      const candIdx = parseInt(btn.dataset.candIdx, 10);
      const candidates = state._replaceCandidates || [];
      const cand = candidates[candIdx];
      const targetSlot = state.replaceTargetSlot;
      if (cand && targetSlot !== null && state.players[targetSlot]) {
        const oldPlayer = state.players[targetSlot];
        // Replace the player but inherit tally
        state.players[targetSlot] = {
          name: cand.name,
          eliminated: false,
          correctTiers: oldPlayer.correctTiers, // inherit
          viewerId: cand.viewerId,
          source: 'viewer'
        };
        // Update Firebase roles: new player becomes player, old viewer becomes audience (if they were a phone player)
        if (state.roomId && window.firebaseSync) {
          window.firebaseSync.setViewerRole(cand.viewerId, 'player', targetSlot, null);
          if (oldPlayer.viewerId) {
            window.firebaseSync.setViewerRole(oldPlayer.viewerId, 'audience', null, null);
          }
        }
        // If this was the active player slot, refresh currentPlayerIdx
        // (currentPlayerIdx tracks slot index, so it stays valid)
      }
      state.showReplaceModal = false;
      state.replaceTargetSlot = null;
      if (state.timerRunning) state.timerPaused = false;
      render();
      break;

    case 'firebase-debug':
      if (window.firebaseSync) {
        const s = window.firebaseSync.getStatus();
        console.log('[firebaseSync] STATUS:', s);
        alert('Firebase status (also logged to console):\n\n' +
          'Configured: ' + s.configured + '\n' +
          'Has API key: ' + s.hasApiKey + '\n' +
          'Has database URL: ' + s.hasDatabaseURL + '\n' +
          'Database URL: ' + s.databaseURL + '\n' +
          'SDK loaded: ' + s.sdkLoaded + '\n' +
          'DB initialized: ' + s.dbInitialized + '\n\n' +
          'Last error: ' + (s.lastError || 'none')
        );
      }
      break;
  }
}

async function resumeSavedGame() {
  const save = await loadSavedGame();
  if (!save) { alert('No saved game found.'); return; }
  state.mode = save.mode;
  state.theme = save.theme;
  state.safetyNetsEnabled = save.safetyNetsEnabled !== false;
  state.currentTier = save.currentTier;
  state.currentQuestion = save.currentQuestion;
  state.usedQuestionIds = save.usedQuestionIds || [];
  state.lifelines = save.lifelines || { googleSearch: true, fiftyFifty: true, askAI: true, audience: true };
  // Handle legacy saves without audience lifeline
  if (state.lifelines.audience === undefined) state.lifelines.audience = true;
  state.hiddenAnswers = save.hiddenAnswers || [];
  state.timerRemaining = save.timerRemaining || TIMER_FOR_TIER(save.currentTier);
  state.selectedAnswer = null;
  state.answerLocked = false;
  state.revealing = false;
  state.confirmingFinal = false;
  state.lifelineEnded = false;
  state.continuePrompt = false;
  state.audienceActive = false;
  state.screen = 'game';
  audio.startBGM();
  render();
}

/* ---------- INIT ---------- */
async function init() {
  if (!window.QUESTION_PACKS || Object.keys(window.QUESTION_PACKS).length === 0) {
    document.getElementById('app').innerHTML = `<div class="error-screen">
      <h2>Error: questions.js not loaded</h2>
      <p>The question data file could not be found or is empty.</p>
      <p>Make sure <code>questions.js</code> is in the same folder as <code>index.html</code>.</p>
    </div>`;
    return;
  }
  await loadSettings();
  await checkSavedGame();
  if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => {}; }
  audio.init();
  audio.setEnabled(state.audioEnabled);
  // Set up lobby room on app load (so viewers can join from main menu)
  setupLobbyRoom();
  render();
}

async function setupLobbyRoom() {
  if (!window.firebaseSync || !window.firebaseSync.isConfigured()) {
    state.firebaseStatus = 'unconfigured';
    return;
  }
  state.firebaseStatus = 'connecting';
  render();
  const code = await window.firebaseSync.createRoom();
  if (!code) {
    state.firebaseStatus = 'failed';
    console.error('[game] Lobby room creation failed. Run window.firebaseSync.getStatus() to see why.');
    render();
    return;
  }
  state.roomId = code;
  state.firebaseStatus = 'connected';
  state.lobbyRoomReady = true;
  // Subscribe to viewers list
  window.firebaseSync.subscribeToViewers((viewers) => {
    // Inject viewerId into each entry so downstream code can reference it
    const enriched = {};
    Object.keys(viewers || {}).forEach(k => {
      enriched[k] = { ...viewers[k], viewerId: k };
    });
    state.lobbyViewers = enriched;
    state.viewerCount = Object.values(enriched).filter(v => !v.isLocal && v.connected).length;
    render();
  });
  console.log('[game] Lobby room ready:', code);
  render();
}

init();
</script>
