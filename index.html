<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Wants to Be a Millionaire — Internet Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg-deep: #020814;
    --bg-mid: #081a3a;
    --bg-light: #0f2556;
    --gold: #f4c430;
    --gold-dim: #c89b1a;
    --gold-glow: #ffd84d;
    --white: #ffffff;
    --dim: #b8c4da;
    --correct: #2ecc71;
    --correct-glow: #55efc4;
    --wrong: #e74c3c;
    --wrong-glow: #ff7675;
    --selected: #ff8c00;
    --selected-glow: #ffb347;
    --safety: #4aa8ff;
    --team: #bb6bd9;
    --team-glow: #d599f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    font-family: 'Rajdhani', sans-serif;
    color: var(--white);
    background: radial-gradient(ellipse at center, var(--bg-light) 0%, var(--bg-mid) 35%, var(--bg-deep) 100%);
    background-attachment: fixed;
    min-height: 100vh; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    z-index: 1;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 120%, rgba(244,196,48,0.08), transparent 60%);
    z-index: 1;
  }
  #app { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; }

  .hero { text-align: center; padding: 3rem 1rem 1.5rem; }
  .hero h1 {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: clamp(1.6rem, 5vw, 3rem);
    letter-spacing: 0.08em; line-height: 1;
    background: linear-gradient(180deg, #fff6c9 0%, var(--gold) 50%, var(--gold-dim) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(244,196,48,0.4);
  }
  .hero .sub {
    font-family: 'Orbitron', sans-serif; font-weight: 500;
    font-size: clamp(0.7rem, 2.5vw, 1rem);
    color: var(--dim); letter-spacing: 0.4em; margin-top: 0.6rem; text-transform: uppercase;
  }

  .btn {
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 1rem; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0.9rem 1.6rem;
    border: 2px solid var(--gold);
    background: linear-gradient(180deg, rgba(244,196,48,0.12), rgba(244,196,48,0.02));
    color: var(--gold); cursor: pointer;
    transition: all 0.2s ease; border-radius: 4px;
    min-width: 220px; text-align: center;
  }
  .btn:hover {
    background: linear-gradient(180deg, rgba(244,196,48,0.25), rgba(244,196,48,0.08));
    box-shadow: 0 0 22px rgba(244,196,48,0.55);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { border-color: var(--dim); color: var(--dim); background: transparent; }
  .btn.ghost:hover { border-color: var(--white); color: var(--white); box-shadow: 0 0 18px rgba(255,255,255,0.2); background: rgba(255,255,255,0.04); }
  .btn.danger { border-color: var(--wrong); color: var(--wrong-glow); background: linear-gradient(180deg, rgba(231,76,60,0.1), transparent); }
  .btn.danger:hover { background: linear-gradient(180deg, rgba(231,76,60,0.25), rgba(231,76,60,0.05)); box-shadow: 0 0 18px rgba(231,76,60,0.5); }
  .btn.confirm { border-color: var(--correct-glow); color: var(--correct-glow); background: linear-gradient(180deg, rgba(46,204,113,0.15), rgba(46,204,113,0.02)); }
  .btn.confirm:hover { background: linear-gradient(180deg, rgba(46,204,113,0.3), rgba(46,204,113,0.08)); box-shadow: 0 0 22px rgba(46,204,113,0.55); }
  .btn.team { border-color: var(--team); color: var(--team-glow); background: linear-gradient(180deg, rgba(187,107,217,0.15), rgba(187,107,217,0.02)); }
  .btn.team:hover { background: linear-gradient(180deg, rgba(187,107,217,0.3), rgba(187,107,217,0.08)); box-shadow: 0 0 22px rgba(187,107,217,0.55); }
  .btn.small { min-width: unset; font-size: 0.78rem; padding: 0.55rem 1rem; letter-spacing: 0.08em; }
  .btn.compact { min-width: unset; padding: 0.7rem 1.2rem; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

  .menu-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; gap: 1rem; }
  .menu-btns { display: flex; flex-direction: column; gap: 0.9rem; width: 100%; max-width: 340px; margin-top: 1.5rem; }
  .footer-mini { text-align: center; color: var(--dim); font-size: 0.75rem; padding: 1.5rem 1rem 1rem; letter-spacing: 0.15em; opacity: 0.6; }

  .game-screen { flex: 1; display: grid; grid-template-columns: 1fr 280px; gap: 1.2rem; padding: 1rem; max-width: 1400px; margin: 0 auto; width: 100%; }
  @media (max-width: 860px) {
    .game-screen { grid-template-columns: 1fr; }
    .side-panel { order: 2; }
    .play-area { order: 1; }
  }
  .play-area { display: flex; flex-direction: column; gap: 1rem; }
  .side-panel { display: flex; flex-direction: column; gap: 1rem; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; padding: 0.6rem 1rem; border: 1px solid rgba(244,196,48,0.3); background: rgba(5,10,25,0.5); border-radius: 6px; }
  .top-bar .left, .top-bar .right { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .mode-badge { font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 0.2em; color: var(--gold); padding: 0.3rem 0.7rem; border: 1px solid var(--gold); border-radius: 3px; text-transform: uppercase; }
  .mode-badge.team { color: var(--team-glow); border-color: var(--team); }
  .tier-text { font-family: 'Orbitron'; font-size: 0.9rem; letter-spacing: 0.1em; color: var(--dim); }
  .tier-text b { color: var(--gold); }

  .current-player-banner { padding: 0.8rem 1rem; background: linear-gradient(90deg, rgba(187,107,217,0.25), rgba(187,107,217,0.08)); border: 2px solid var(--team); border-radius: 6px; text-align: center; box-shadow: 0 0 18px rgba(187,107,217,0.3); }
  .current-player-banner .label { font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 0.2em; color: var(--team-glow); text-transform: uppercase; }
  .current-player-banner .name { font-family: 'Orbitron'; font-size: 1.3rem; font-weight: 700; color: white; margin-top: 0.2rem; }

  .timer-wrap { display: flex; justify-content: center; padding: 0.5rem 0; }
  .timer { font-family: 'Orbitron'; font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 900; color: var(--gold); letter-spacing: 0.1em; text-shadow: 0 0 24px rgba(244,196,48,0.55); min-width: 120px; text-align: center; padding: 0.2rem 1.2rem; border: 2px solid var(--gold); border-radius: 6px; background: rgba(5,10,25,0.6); transition: all 0.2s; }
  .timer.warning { color: var(--wrong-glow); border-color: var(--wrong); text-shadow: 0 0 24px rgba(231,76,60,0.7); animation: pulseWarn 0.6s infinite alternate; }
  .timer.paused { color: var(--dim); border-color: var(--dim); text-shadow: none; }
  @keyframes pulseWarn { from { transform: scale(1); } to { transform: scale(1.04); } }

  .question-box { padding: 1.5rem 1.4rem; background: linear-gradient(180deg, rgba(15,37,86,0.9), rgba(8,26,58,0.9)); border: 2px solid var(--gold); border-radius: 6px; position: relative; box-shadow: 0 0 30px rgba(244,196,48,0.18), inset 0 0 40px rgba(0,0,0,0.3); min-height: 100px; }
  .question-box::before { content: ""; position: absolute; top: -10px; left: 50%; width: 20px; height: 20px; background: var(--gold); transform: translateX(-50%) rotate(45deg); box-shadow: 0 0 12px rgba(244,196,48,0.5); }
  .question-text { font-family: 'Rajdhani'; font-weight: 600; font-size: clamp(1.05rem, 2.5vw, 1.4rem); line-height: 1.4; text-align: center; color: var(--white); }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  @media (max-width: 500px) { .answers { grid-template-columns: 1fr; } }
  .answer { display: flex; align-items: center; gap: 0.7rem; padding: 0.9rem 1rem; border: 2px solid var(--gold); background: linear-gradient(90deg, rgba(15,37,86,0.8), rgba(8,26,58,0.5)); color: var(--white); font-family: 'Rajdhani'; font-weight: 600; font-size: clamp(0.95rem, 2vw, 1.1rem); cursor: pointer; text-align: left; transition: all 0.2s ease; border-radius: 4px; clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0 50%); min-height: 56px; }
  .answer:hover:not(:disabled):not(.locked) { background: linear-gradient(90deg, rgba(244,196,48,0.18), rgba(244,196,48,0.04)); box-shadow: 0 0 18px rgba(244,196,48,0.35); }
  .answer .letter { font-family: 'Orbitron'; font-weight: 900; color: var(--gold); margin-right: 0.3rem; font-size: 1.15em; }
  .answer.selected { background: linear-gradient(90deg, rgba(255,140,0,0.45), rgba(255,140,0,0.18)); border-color: var(--selected-glow); box-shadow: 0 0 26px var(--selected); }
  .answer.selected .letter { color: var(--selected-glow); }
  .answer.correct { background: linear-gradient(90deg, rgba(46,204,113,0.5), rgba(46,204,113,0.2)); border-color: var(--correct-glow); box-shadow: 0 0 28px var(--correct); animation: flashGreen 0.5s 2; }
  .answer.correct .letter { color: var(--correct-glow); }
  .answer.wrong { background: linear-gradient(90deg, rgba(231,76,60,0.5), rgba(231,76,60,0.2)); border-color: var(--wrong-glow); box-shadow: 0 0 28px var(--wrong); }
  .answer.wrong .letter { color: var(--wrong-glow); }
  .answer.hidden { visibility: hidden; }
  .answer:disabled, .answer.locked { cursor: default; }
  @keyframes flashGreen { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }

  /* Lifelines: single row on desktop, 2x2 grid on mobile */
  .lifelines { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.7rem; padding: 0.4rem; max-width: 700px; margin: 0 auto; width: 100%; }
  @media (max-width: 600px) { .lifelines { grid-template-columns: 1fr 1fr; } }
  .lifeline { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; padding: 0.6rem 0.8rem; background: rgba(5,10,25,0.7); border: 2px solid var(--gold); border-radius: 10px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.68rem; letter-spacing: 0.08em; color: var(--gold); transition: all 0.2s; }
  .lifeline:hover:not(:disabled) { background: rgba(244,196,48,0.15); box-shadow: 0 0 18px rgba(244,196,48,0.45); transform: translateY(-2px); }
  .lifeline:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(0.8); text-decoration: line-through; }
  .lifeline .icon { font-size: 1.3rem; }
  .lifeline .label { font-weight: 700; text-align: center; line-height: 1.1; }

  .prize-panel { padding: 0.8rem; background: rgba(5,10,25,0.7); border: 1px solid rgba(244,196,48,0.3); border-radius: 6px; display: flex; flex-direction: column; gap: 2px; }
  .prize-row { display: flex; justify-content: space-between; padding: 0.35rem 0.7rem; font-family: 'Orbitron'; font-size: 0.8rem; border-radius: 3px; color: var(--dim); letter-spacing: 0.06em; }
  .prize-row.safety { color: var(--safety); font-weight: 700; }
  .prize-row.current { background: linear-gradient(90deg, var(--selected), #ff6b00); color: white; box-shadow: 0 0 14px rgba(255,140,0,0.6); font-weight: 700; }
  .prize-row.cleared { color: var(--correct-glow); }
  .prize-row .tier { opacity: 0.6; font-size: 0.75em; }

  .players-panel { padding: 0.8rem; background: rgba(5,10,25,0.7); border: 1px solid var(--team); border-radius: 6px; }
  .players-panel .title { font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 0.2em; color: var(--team-glow); text-transform: uppercase; margin-bottom: 0.6rem; }
  .player-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.6rem; margin-bottom: 0.3rem; background: rgba(187,107,217,0.1); border-left: 3px solid var(--team); border-radius: 3px; font-family: 'Orbitron'; font-size: 0.8rem; }
  .player-row.current { background: rgba(255,140,0,0.2); border-left-color: var(--selected); box-shadow: 0 0 10px rgba(255,140,0,0.3); }
  .player-row.eliminated { opacity: 0.4; text-decoration: line-through; }
  .player-row .tally { color: var(--correct-glow); font-size: 0.75rem; letter-spacing: 0.1em; }

  .host-panel { padding: 0.8rem; background: rgba(10,30,60,0.6); border: 2px dashed var(--safety); border-radius: 6px; display: flex; flex-direction: column; gap: 0.6rem; }
  .host-panel .title { font-family: 'Orbitron'; font-size: 0.75rem; letter-spacing: 0.2em; color: var(--safety); text-transform: uppercase; }
  .host-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .host-btn { font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 0.08em; padding: 0.5rem 0.8rem; border: 1px solid var(--safety); background: rgba(74,168,255,0.1); color: var(--safety); cursor: pointer; border-radius: 3px; text-transform: uppercase; transition: all 0.15s; }
  .host-btn:hover:not(:disabled) { background: rgba(74,168,255,0.25); box-shadow: 0 0 10px rgba(74,168,255,0.4); }
  .host-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .host-btn.warn { border-color: var(--wrong); color: var(--wrong-glow); background: rgba(231,76,60,0.1); }
  .host-btn.warn:hover:not(:disabled) { background: rgba(231,76,60,0.25); }

  .qr-panel { padding: 0.8rem; background: rgba(5,10,25,0.8); border: 1px solid var(--correct); border-radius: 6px; text-align: center; }
  .qr-panel .title { font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 0.15em; color: var(--correct-glow); text-transform: uppercase; margin-bottom: 0.5rem; }
  .qr-panel .code { font-family: 'Orbitron'; font-size: 1.3rem; font-weight: 900; color: var(--gold); letter-spacing: 0.2em; margin: 0.4rem 0; }
  .qr-panel .url { font-family: monospace; font-size: 0.7rem; color: var(--dim); word-break: break-all; margin-top: 0.4rem; }
  .qr-canvas { background: white; padding: 8px; border-radius: 4px; display: inline-block; margin: 0.3rem 0; }
  .qr-panel .viewer-count { font-family: 'Orbitron'; font-size: 0.8rem; color: var(--correct-glow); margin-top: 0.4rem; }

  .overlay { position: fixed; inset: 0; background: rgba(2,8,20,0.92); backdrop-filter: blur(6px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { max-width: 600px; width: 100%; padding: 2rem 1.5rem; border: 2px solid var(--gold); background: linear-gradient(180deg, rgba(15,37,86,0.95), rgba(8,26,58,0.95)); border-radius: 8px; text-align: center; box-shadow: 0 0 50px rgba(244,196,48,0.3); animation: scaleIn 0.3s ease-out; max-height: 90vh; overflow-y: auto; }
  @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h2 { font-family: 'Orbitron'; font-size: 1.6rem; margin-bottom: 1rem; background: linear-gradient(180deg, #fff6c9, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 0.08em; }
  .modal p { margin-bottom: 1rem; font-size: 1.05rem; color: var(--dim); }
  .modal .prize-big { font-family: 'Orbitron'; font-size: 2.2rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 30px rgba(244,196,48,0.7); margin: 1rem 0; }
  .modal .selected-answer { font-family: 'Orbitron'; font-size: 1.3rem; font-weight: 700; color: var(--selected-glow); background: rgba(255,140,0,0.15); border: 1px solid var(--selected); padding: 0.8rem; margin: 1rem 0; border-radius: 4px; box-shadow: 0 0 20px rgba(255,140,0,0.3); }
  .modal-btns { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }

  .audience-grid { display: flex; flex-direction: column; gap: 0.7rem; margin: 1rem 0; }
  .audience-bar-row { display: flex; align-items: center; gap: 0.8rem; }
  .audience-bar-row .letter { font-family: 'Orbitron'; font-weight: 900; font-size: 1.3rem; color: var(--gold); min-width: 1.5em; text-align: center; }
  .audience-bar-wrap { flex: 1; height: 32px; background: rgba(5,10,25,0.7); border: 1px solid rgba(244,196,48,0.3); border-radius: 4px; position: relative; overflow: hidden; }
  .audience-bar-fill { position: absolute; top: 0; left: 0; bottom: 0; background: linear-gradient(90deg, rgba(244,196,48,0.4), rgba(244,196,48,0.8)); transition: width 0.4s ease-out; box-shadow: 0 0 14px rgba(244,196,48,0.3); }
  .audience-bar-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-weight: 700; font-size: 0.9rem; color: white; text-shadow: 0 0 4px black; }
  .audience-progress { font-family: 'Orbitron'; font-size: 0.85rem; color: var(--dim); letter-spacing: 0.1em; margin: 0.5rem 0; }
  .audience-progress b { color: var(--gold); }

  .continue-prize { font-family: 'Orbitron'; font-size: 1.8rem; font-weight: 900; color: var(--correct-glow); text-shadow: 0 0 20px rgba(85,239,196,0.5); margin: 0.8rem 0; }
  .risk-warning { background: rgba(231,76,60,0.15); border: 1px solid var(--wrong); border-radius: 4px; padding: 0.6rem 0.8rem; color: #ffb3ad; font-size: 0.9rem; margin: 0.6rem 0; }

  .team-setup-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center; }
  .team-setup-row input { flex: 1; padding: 0.6rem 0.8rem; background: rgba(255,255,255,0.08); border: 1px solid var(--team); border-radius: 4px; color: white; font-family: 'Rajdhani'; font-size: 1rem; }
  .team-setup-row input:focus { outline: none; border-color: var(--team-glow); box-shadow: 0 0 10px rgba(187,107,217,0.3); }
  .team-setup-row .label { font-family: 'Orbitron'; font-size: 0.75rem; color: var(--team-glow); min-width: 3em; }

  .lifeline-active { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 50; padding: 0.7rem 1.3rem; background: rgba(5,10,25,0.95); border: 2px solid var(--selected-glow); border-radius: 40px; box-shadow: 0 0 30px var(--selected); display: flex; align-items: center; gap: 0.8rem; font-family: 'Orbitron'; }
  .lifeline-active .label { font-size: 0.8rem; color: var(--selected-glow); letter-spacing: 0.15em; }
  .lifeline-active .countdown { font-size: 1.6rem; font-weight: 900; color: var(--gold); }

  .scores-list { display: flex; flex-direction: column; gap: 0.4rem; margin: 1rem 0; max-height: 300px; overflow-y: auto; text-align: left; }
  .score-row { display: flex; justify-content: space-between; padding: 0.5rem 0.8rem; background: rgba(15,37,86,0.5); border-left: 3px solid var(--gold); font-family: 'Orbitron'; font-size: 0.85rem; }
  .score-row .amount { color: var(--gold); font-weight: 700; }
  .score-row .meta { color: var(--dim); font-size: 0.75rem; }

  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 0; border-bottom: 1px solid rgba(244,196,48,0.2); }
  .toggle { position: relative; width: 50px; height: 26px; background: #333; border-radius: 20px; cursor: pointer; border: 1px solid var(--dim); transition: all 0.2s; }
  .toggle.on { background: var(--gold); border-color: var(--gold-glow); }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: all 0.2s; }
  .toggle.on::after { left: 26px; }

  .theme-list { display: flex; flex-direction: column; gap: 0.7rem; width: 100%; max-width: 500px; margin-top: 1.5rem; }
  .theme-card { background: rgba(5,10,25,0.6); border: 2px solid var(--gold); border-radius: 6px; padding: 1rem; cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; font-family: 'Rajdhani'; color: white; }
  .theme-card:hover { background: rgba(244,196,48,0.1); box-shadow: 0 0 22px rgba(244,196,48,0.4); transform: translateY(-2px); }
  .theme-card .name { font-family: 'Orbitron'; font-size: 1.1rem; font-weight: 700; color: var(--gold); letter-spacing: 0.05em; }
  .theme-card .description { font-size: 0.9rem; color: var(--dim); margin-top: 0.4rem; line-height: 1.35; }
  .theme-card .meta { font-family: 'Orbitron'; font-size: 0.7rem; color: var(--gold-glow); margin-top: 0.4rem; letter-spacing: 0.08em; }

  .hidden { display: none !important; }
  .walk-away-bar { display: flex; justify-content: center; padding-top: 0.5rem; gap: 0.7rem; flex-wrap: wrap; }
  .notice { text-align: center; padding: 0.6rem; color: var(--dim); font-size: 0.85rem; font-style: italic; }
  .error-screen { padding: 2rem 1rem; text-align: center; color: var(--wrong-glow); max-width: 520px; margin: 3rem auto; border: 2px solid var(--wrong); border-radius: 6px; background: rgba(231,76,60,0.08); }
  .error-screen h2 { font-family: 'Orbitron'; margin-bottom: 1rem; }
  .error-screen code { background: rgba(0,0,0,0.4); padding: 0.1rem 0.4rem; border-radius: 3px; color: var(--gold); }

  .setup-card { background: rgba(5,10,25,0.7); border: 1px solid var(--gold); border-radius: 6px; padding: 1.2rem; max-width: 480px; width: 100%; }
  .setup-card h3 { font-family: 'Orbitron'; font-size: 0.85rem; letter-spacing: 0.15em; color: var(--gold); text-transform: uppercase; margin-bottom: 0.8rem; }
  .player-count-btns { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .pc-btn { flex: 1; padding: 0.7rem; background: rgba(187,107,217,0.1); border: 2px solid var(--team); color: var(--team-glow); font-family: 'Orbitron'; font-weight: 700; cursor: pointer; border-radius: 4px; transition: all 0.15s; }
  .pc-btn.active { background: var(--team); color: white; box-shadow: 0 0 15px rgba(187,107,217,0.5); }
</style>
</head>
<body>
<div id="app"></div>

<script src="questions.js"></script>
<script src="audio.js"></script>
<script src="firebase.js"></script>

<script>
/* =========================================================
   WHO WANTS TO BE A MILLIONAIRE — INTERNET EDITION
   Main game logic. Audio: audio.js. Questions: questions.js.
   Firebase viewer sync: firebase.js.
   ========================================================= */

/* ---------- CONSTANTS ---------- */
const PRIZE_LADDER = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000, 250000, 500000, 1000000];
const SAFETY_NET_TIERS = [4, 9];
const TIMER_FOR_TIER = (tierIdx) => {
  if (tierIdx <= 4) return 30;
  if (tierIdx <= 9) return 45;
  return 60;
};
const LIFELINE_GOOGLE_SECONDS = 20;
const LIFELINE_AI_SECONDS = 20;

// Ask the Audience: 10 AI voters with individual accuracies.
// Blend: 2 high (75%), 3 medium (60%), 3 low (45%), 2 random (30%). Mean ~53%.
const AI_VOTER_NAMES = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Epsilon', 'Zeta', 'Eta', 'Theta', 'Iota', 'Kappa'];
const AI_VOTER_ACCURACIES = [0.75, 0.75, 0.60, 0.60, 0.60, 0.45, 0.45, 0.45, 0.30, 0.30];

/* ---------- STATE ---------- */
let state = {
  screen: 'menu',
  mode: null,                  // 'single' | 'host' | 'coop' | 'versus'
  theme: null,
  safetyNetsEnabled: true,
  currentTier: 0,
  currentQuestion: null,
  usedQuestionIds: [],
  lifelines: { googleSearch: true, fiftyFifty: true, askAI: true, audience: true },
  hiddenAnswers: [],
  selectedAnswer: null,
  answerLocked: false,
  revealing: false,
  confirmingFinal: false,
  lifelineEnded: false,
  continuePrompt: false,       // "Continue or walk away?" modal (safety nets off)
  timerRemaining: 0,
  timerPaused: false,
  timerRunning: false,
  voiceEnabled: false,
  audioEnabled: true,
  lifelineActiveTab: null,
  lifelineActiveType: null,
  lifelineRemaining: 0,
  resultData: null,
  // Team state
  players: [],                 // [{ name, eliminated, correctTiers: [] }]
  turnOrder: [],               // indexes into players[], current round's order
  turnPos: 0,                  // position in turnOrder for current question
  currentPlayerIdx: null,      // index into players[]
  // Audience
  audienceActive: false,
  audienceTally: [0, 0, 0, 0],
  audienceVoters: [],          // { name, choice, isAI }
  audienceTotalExpected: 0,
  // QR / Firebase
  roomId: null,
  viewerCount: 0,
  firebaseStatus: null,
  lobbyRoomReady: false,
  lobbyViewers: {},      // { viewerId: { name, role, ... } }
  intentListenerSetup: false,
  // Roster: which viewers / local names are assigned to which player slot
  roster: [],            // [{ source:'local'|'viewer', viewerId, name, slot }]
  audienceExpiresAt: 0,  // ms timestamp, set by host when Ask the Audience triggered
  // Replace-player modal
  showReplaceModal: false,
  replaceTargetSlot: null,
  // Setup transient state (legacy local-only path)
  setupPlayers: [],
  setupPlayerCount: 2,
};

let timerIntervalId = null;
let lifelineIntervalId = null;
let audienceIntervalId = null;
let hasSavedGame = false;

/* ---------- PERSISTENCE (layered) ---------- */
const memStore = {};
function hasClaudeStorage() { return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }
function hasLocalStorage() { try { if (!window.localStorage) return false; const k = '__mstest__'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return true; } catch (e) { return false; } }

async function storageGet(key) {
  if (hasClaudeStorage()) { try { const r = await window.storage.get(key); return r && r.value ? r.value : null; } catch (e) {} }
  if (hasLocalStorage()) { try { return window.localStorage.getItem(key); } catch (e) {} }
  return memStore[key] || null;
}
async function storageSet(key, value) {
  if (hasClaudeStorage()) { try { await window.storage.set(key, value); return; } catch (e) {} }
  if (hasLocalStorage()) { try { window.localStorage.setItem(key, value); return; } catch (e) {} }
  memStore[key] = value;
}
async function storageDelete(key) {
  if (hasClaudeStorage()) { try { await window.storage.delete(key); } catch (e) {} }
  if (hasLocalStorage()) { try { window.localStorage.removeItem(key); } catch (e) {} }
  delete memStore[key];
}

async function saveCurrentGame() {
  try {
    if (state.screen !== 'game') return;
    // Only save single-player (team mode state is complex; saves skipped there)
    if (state.mode !== 'single') return;
    const save = {
      mode: state.mode, theme: state.theme,
      safetyNetsEnabled: state.safetyNetsEnabled,
      currentTier: state.currentTier,
      currentQuestion: state.currentQuestion,
      usedQuestionIds: state.usedQuestionIds,
      lifelines: state.lifelines,
      hiddenAnswers: state.hiddenAnswers,
      timerRemaining: state.timerRemaining,
      savedAt: new Date().toISOString(),
    };
    await storageSet('millionaire_save', JSON.stringify(save));
    hasSavedGame = true;
  } catch (e) {}
}
async function loadSavedGame() { try { const v = await storageGet('millionaire_save'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
async function deleteSavedGame() { try { await storageDelete('millionaire_save'); hasSavedGame = false; } catch (e) {} }
async function checkSavedGame() { const s = await loadSavedGame(); hasSavedGame = !!s; return hasSavedGame; }
async function loadHighScores() { try { const v = await storageGet('millionaire_scores'); return v ? JSON.parse(v) : []; } catch (e) { return []; } }
async function saveHighScore(entry) {
  try {
    const scores = await loadHighScores();
    scores.push({ ...entry, date: new Date().toISOString() });
    scores.sort((a, b) => b.amount - a.amount);
    await storageSet('millionaire_scores', JSON.stringify(scores.slice(0, 20)));
  } catch (e) {}
}
async function loadSettings() {
  try {
    const v = await storageGet('millionaire_settings');
    if (v) { const s = JSON.parse(v); state.voiceEnabled = !!s.voiceEnabled; if (s.audioEnabled !== undefined) state.audioEnabled = !!s.audioEnabled; }
  } catch (e) {}
}
async function saveSettings() { try { await storageSet('millionaire_settings', JSON.stringify({ voiceEnabled: state.voiceEnabled, audioEnabled: state.audioEnabled })); } catch (e) {} }

/* ---------- VOICE ---------- */
function speak(text) {
  if (!state.voiceEnabled) return;
  if (state.screen !== 'game') return;
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 0.85; u.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => /daniel|fred|alex|david|google uk english male|male/i.test(v.name + ' ' + (v.lang || '')));
    if (preferred) u.voice = preferred;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function stopSpeaking() { try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {} }

/* ---------- QUESTION PICKING ---------- */
function getPack(themeKey) { return (window.QUESTION_PACKS || {})[themeKey]; }
function pickQuestionForTier(tierIdx) {
  const tier = tierIdx + 1;
  const pack = getPack(state.theme);
  if (!pack || !pack.questions) return null;
  const pool = pack.questions[tier];
  if (!pool || pool.length === 0) return null;
  const tagged = pool.map((q, i) => ({ ...q, id: `${state.theme}-t${tier}-${i}` }));
  const available = tagged.filter(q => !state.usedQuestionIds.includes(q.id));
  const candidates = available.length > 0 ? available : tagged;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

/* ---------- TEAM MODE HELPERS ---------- */
function isTeamMode() { return state.mode === 'coop' || state.mode === 'versus'; }

function shuffleTurnOrder() {
  // Build fresh order of all non-eliminated players, shuffled
  const alive = state.players
    .map((p, idx) => ({ p, idx }))
    .filter(x => !x.p.eliminated)
    .map(x => x.idx);
  // Fisher-Yates
  for (let i = alive.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [alive[i], alive[j]] = [alive[j], alive[i]];
  }
  state.turnOrder = alive;
  state.turnPos = 0;
}

function advanceToNextPlayer() {
  state.turnPos++;
  if (state.turnPos >= state.turnOrder.length) {
    shuffleTurnOrder();
  }
  state.currentPlayerIdx = state.turnOrder[state.turnPos];
}

function alivePlayerCount() { return state.players.filter(p => !p.eliminated).length; }

/* ---------- GAME FLOW ---------- */
function startNewGame(mode, theme, opts = {}) {
  state.mode = mode;
  state.theme = theme;
  state.safetyNetsEnabled = opts.safetyNetsEnabled !== false;
  state.currentTier = 0;
  state.usedQuestionIds = [];
  state.lifelines = { googleSearch: true, fiftyFifty: true, askAI: true, audience: true };
  state.confirmingFinal = false;
  state.lifelineEnded = false;
  state.continuePrompt = false;
  state.audienceActive = false;

  // Build players list — roster takes precedence if provided
  if (opts.roster && opts.roster.length > 0) {
    state.players = opts.roster.map(r => ({
      name: r.name,
      eliminated: false,
      correctTiers: [],
      viewerId: r.viewerId || null,  // null = local player at host PC
      source: r.source              // 'local' | 'viewer'
    }));
  } else if (isTeamMode()) {
    state.players = (opts.players || []).map(name => ({
      name, eliminated: false, correctTiers: [],
      viewerId: null, source: 'local'
    }));
  } else if (mode === 'single' && opts.singlePlayerName) {
    state.players = [{
      name: opts.singlePlayerName,
      eliminated: false, correctTiers: [],
      viewerId: opts.singlePlayerViewerId || null,
      source: opts.singlePlayerViewerId ? 'viewer' : 'local'
    }];
  } else {
    state.players = [];
  }

  if (isTeamMode() || (mode === 'single' && state.players.length > 0)) {
    if (isTeamMode()) {
      shuffleTurnOrder();
      state.currentPlayerIdx = state.turnOrder[0];
    } else {
      state.currentPlayerIdx = 0;
    }
  } else {
    state.currentPlayerIdx = null;
  }

  state.screen = 'game';
  audio.startBGM();

  // Set meta on Firebase room (room already exists from main menu)
  if (state.roomId && window.firebaseSync) {
    window.firebaseSync.setMeta({
      phase: 'game',
      mode: state.mode,
      hostMode: !!opts.hostMode,
      theme: state.theme,
      safetyNetsEnabled: state.safetyNetsEnabled
    });
    setupIntentListener();
  }

  loadQuestionForCurrentTier(true);
  render();
}

function loadQuestionForCurrentTier(autoStartTimerInSingle) {
  const q = pickQuestionForTier(state.currentTier);
  state.currentQuestion = q;
  if (q) state.usedQuestionIds.push(q.id);
  state.hiddenAnswers = [];
  state.selectedAnswer = null;
  state.answerLocked = false;
  state.revealing = false;
  state.confirmingFinal = false;
  state.lifelineEnded = false;
  state.continuePrompt = false;
  state.audienceActive = false;
  state.audienceTally = [0, 0, 0, 0];
  state.audienceVoters = [];
  state.timerRemaining = TIMER_FOR_TIER(state.currentTier);
  state.timerPaused = false;
  state.timerRunning = false;

  // Game state is broadcast via render() → broadcastGameState()
  render();

  if ((state.mode === 'single' || isTeamMode()) && autoStartTimerInSingle) {
    setTimeout(() => {
      if (state.screen !== 'game') return;
      startTimer();
      if (state.currentQuestion) speak(
        `Question ${state.currentTier + 1}. For $${PRIZE_LADDER[state.currentTier].toLocaleString()}. ${state.currentQuestion.q}`
      );
    }, 400);
  }
}

function startTimer() {
  if (timerIntervalId) clearInterval(timerIntervalId);
  state.timerRunning = true;
  state.timerPaused = false;
  timerIntervalId = setInterval(() => {
    if (state.timerPaused) return;
    state.timerRemaining--;
    if (state.timerRemaining <= 10 && state.timerRemaining > 0) audio.warning();
    if (state.timerRemaining <= 0) {
      state.timerRemaining = 0;
      clearInterval(timerIntervalId); timerIntervalId = null;
      state.timerRunning = false;
      audio.timerZeroBuzzer();
      handleTimeout();
    }
    render();
  }, 1000);
  render();
}
function pauseTimer() { state.timerPaused = true; render(); }
function resumeTimer() { if (state.timerRunning) { state.timerPaused = false; render(); } else startTimer(); }
function stopTimer() { if (timerIntervalId) { clearInterval(timerIntervalId); timerIntervalId = null; } state.timerRunning = false; }
function adjustTimer(delta) { state.timerRemaining = Math.max(0, state.timerRemaining + delta); render(); }
function handleTimeout() { revealAndResolve(null, true); }

function selectAnswer(idx) {
  if (state.answerLocked || state.revealing || state.confirmingFinal || state.lifelineEnded || state.continuePrompt || state.audienceActive) return;
  if (state.hiddenAnswers.includes(idx)) return;
  state.selectedAnswer = idx;
  audio.select();
  render();
}

function openFinalConfirm() {
  if (state.selectedAnswer === null || state.answerLocked || state.confirmingFinal) return;
  state.confirmingFinal = true;
  state.timerPaused = true;
  audio.finalAnswerTension();
  render();
  setTimeout(() => { if (state.confirmingFinal && state.screen === 'game') speak("Is that your final answer?"); }, 100);
}
function confirmYes() {
  if (!state.confirmingFinal) return;
  state.confirmingFinal = false;
  stopSpeaking();
  revealAndResolve(state.selectedAnswer, false);
}
function confirmNo() {
  if (!state.confirmingFinal) return;
  state.confirmingFinal = false;
  stopSpeaking();
  state.timerPaused = false;
  render();
}

function hostForceSelect(idx) { if (state.answerLocked || state.revealing) return; state.selectedAnswer = idx; audio.select(); render(); }
function hostConfirm() { if (state.selectedAnswer === null) return; revealAndResolve(state.selectedAnswer, false); }
function hostMarkCorrect() {
  if (state.selectedAnswer === null) return;
  state.answerLocked = true; state.revealing = true; stopTimer();
  audio.correct(); speak("Correct!");
  render();
  setTimeout(() => advanceAfterCorrect(), 1800);
}
function hostMarkWrong() {
  state.answerLocked = true; state.revealing = true; stopTimer();
  audio.wrong();
  render();
  setTimeout(() => endGame(false, "wrong"), 2000);
}

function revealAndResolve(chosenIdx, timeout) {
  state.answerLocked = true;
  state.revealing = true;
  stopTimer();
  render();
  const correctIdx = state.currentQuestion.correct;
  const wasCorrect = chosenIdx === correctIdx;
  if (timeout) { audio.timeUp(); speak("Time's up!"); }
  else if (wasCorrect) { audio.correct(); speak("Correct!"); }
  else { audio.wrong(); speak("I'm sorry, that's the wrong answer."); }

  // Track correct for team mode
  if (wasCorrect && isTeamMode() && state.currentPlayerIdx !== null) {
    state.players[state.currentPlayerIdx].correctTiers.push(state.currentTier + 1);
  }

  setTimeout(() => {
    if (wasCorrect) { audio.tierAdvance(); advanceAfterCorrect(); }
    else handleWrongAnswer(timeout);
  }, 2400);
}

function handleWrongAnswer(timeout) {
  if (isTeamMode()) {
    // Eliminate current player
    audio.playerEliminated();
    state.players[state.currentPlayerIdx].eliminated = true;
    if (alivePlayerCount() === 0) {
      endGame(false, timeout ? 'timeout' : 'wrong');
      return;
    }
    // Next player answers a NEW question from the same tier
    advanceToNextPlayer();
    // Force-pick a fresh question from the tier (excluding the one just missed)
    loadQuestionForCurrentTier(true);
  } else {
    endGame(false, timeout ? 'timeout' : 'wrong');
  }
}

function advanceAfterCorrect() {
  const nextTier = state.currentTier + 1;
  if (nextTier >= PRIZE_LADDER.length) { endGame(true, 'win'); return; }

  // Safety nets OFF: prompt continue/walk-away after each correct answer
  // BUT not in team modes (too chaotic) — for team modes, the game just continues.
  if (!state.safetyNetsEnabled && !isTeamMode()) {
    state.continuePrompt = true;
    state.timerPaused = true;
    render();
    return;
  }

  proceedToNextTier();
}

function proceedToNextTier() {
  state.continuePrompt = false;
  state.currentTier++;
  if (isTeamMode()) {
    advanceToNextPlayer();
  }
  loadQuestionForCurrentTier(state.mode === 'single' || isTeamMode());
}

function continueChosen() { if (!state.continuePrompt) return; proceedToNextTier(); }

function walkAwayChosen() {
  // Used from the continue/walk-away modal
  if (!state.continuePrompt) return;
  state.continuePrompt = false;
  endGame(false, 'walkaway');
}

function walkAway() {
  // Regular walk away button (before answering)
  if (!confirm("Walk away now and take your current winnings?")) return;
  endGame(false, 'walkaway');
}

async function endGame(won, reason) {
  stopTimer();
  stopSpeaking();
  audio.stopBGM();

  let amount = 0;
  let perPlayerBreakdown = null;

  if (won) {
    amount = PRIZE_LADDER[PRIZE_LADDER.length - 1];
  } else if (reason === 'walkaway') {
    // Single player walking away
    amount = state.currentTier > 0 ? PRIZE_LADDER[state.currentTier - 1] : 0;
  } else {
    // Wrong answer or timeout
    if (isTeamMode() && state.mode === 'coop' && alivePlayerCount() === 0) {
      // Everyone eliminated
      if (state.safetyNetsEnabled) {
        let safe = 0;
        for (let i = 0; i < SAFETY_NET_TIERS.length; i++) {
          if (SAFETY_NET_TIERS[i] < state.currentTier) safe = PRIZE_LADDER[SAFETY_NET_TIERS[i]];
        }
        amount = safe;
      } else {
        amount = 0;
      }
    } else if (isTeamMode() && state.mode === 'versus' && alivePlayerCount() === 0) {
      // Versus: last player got it wrong. They don't get anything.
      amount = 0;
    } else {
      // Single player wrong answer
      if (state.safetyNetsEnabled) {
        let safe = 0;
        for (let i = 0; i < SAFETY_NET_TIERS.length; i++) {
          if (SAFETY_NET_TIERS[i] < state.currentTier) safe = PRIZE_LADDER[SAFETY_NET_TIERS[i]];
        }
        amount = safe;
      } else {
        amount = 0;
      }
    }
  }

  // Team mode: compute per-player share
  if (isTeamMode() && amount > 0) {
    if (state.mode === 'coop') {
      // Shared pot, split equally among ALL players (including eliminated)
      const per = Math.floor(amount / state.players.length);
      perPlayerBreakdown = state.players.map(p => ({
        name: p.name, eliminated: p.eliminated,
        correctCount: p.correctTiers.length,
        share: per
      }));
    } else if (state.mode === 'versus') {
      // Only survivors share. If exactly one survives, they get all.
      const survivors = state.players.filter(p => !p.eliminated);
      if (survivors.length === 1) {
        perPlayerBreakdown = state.players.map(p => ({
          name: p.name, eliminated: p.eliminated,
          correctCount: p.correctTiers.length,
          share: p.eliminated ? 0 : amount
        }));
      } else if (survivors.length > 1) {
        // Multiple survivors: split proportionally by correct answers
        const totalCorrect = survivors.reduce((s, p) => s + p.correctTiers.length, 0);
        if (totalCorrect === 0) {
          // Edge case: all survivors got 0 correct (shouldn't really happen)
          const per = Math.floor(amount / survivors.length);
          perPlayerBreakdown = state.players.map(p => ({
            name: p.name, eliminated: p.eliminated,
            correctCount: p.correctTiers.length,
            share: p.eliminated ? 0 : per
          }));
        } else {
          perPlayerBreakdown = state.players.map(p => ({
            name: p.name, eliminated: p.eliminated,
            correctCount: p.correctTiers.length,
            share: p.eliminated ? 0 : Math.floor(amount * (p.correctTiers.length / totalCorrect))
          }));
        }
      }
    }
  }

  await saveHighScore({
    amount, tier: state.currentTier + 1,
    theme: state.theme, mode: state.mode,
    result: won ? 'won' : reason,
    players: isTeamMode() ? state.players.map(p => ({ name: p.name, eliminated: p.eliminated, correctCount: p.correctTiers.length })) : null,
    safetyNets: state.safetyNetsEnabled,
  });
  await deleteSavedGame();

  // Notify viewers — set phase to ended but keep room alive
  if (state.roomId && window.firebaseSync) {
    await window.firebaseSync.setMeta({ phase: 'ended' });
  }

  state.screen = 'result';
  state.resultData = { won, amount, reason, perPlayerBreakdown };
  setTimeout(() => {
    if (won) audio.win();
    else if (reason === 'walkaway') audio.walkAway();
  }, 300);
  render();
}

/* ---------- LIFELINES ---------- */
function useFiftyFifty() {
  if (!state.lifelines.fiftyFifty || state.answerLocked || state.confirmingFinal) return;
  state.lifelines.fiftyFifty = false;
  const correct = state.currentQuestion.correct;
  const wrongs = [0, 1, 2, 3].filter(i => i !== correct).sort(() => Math.random() - 0.5);
  state.hiddenAnswers = wrongs.slice(0, 2);
  audio.lifelineActivate();
  speak("Fifty fifty.");
  render();
}

function useGoogleSearch() {
  if (!state.lifelines.googleSearch || state.answerLocked || state.confirmingFinal) return;
  state.lifelines.googleSearch = false;
  audio.lifelineActivate();
  openLifelineTab('https://www.google.com', LIFELINE_GOOGLE_SECONDS, 'google');
}
function useAskAI() {
  if (!state.lifelines.askAI || state.answerLocked || state.confirmingFinal) return;
  state.lifelines.askAI = false;
  audio.lifelineActivate();
  openLifelineTab('https://chat.openai.com/', LIFELINE_AI_SECONDS, 'ai');
}

function openLifelineTab(url, seconds, type) {
  state.timerPaused = true;
  state.lifelineActiveType = type;
  let tab = null;
  try { tab = window.open(url, '_blank'); } catch (e) {}
  if (!tab) {
    alert("Pop-up was blocked. Please allow pop-ups for this game, then try again.");
    state.timerPaused = false; state.lifelineActiveType = null; render(); return;
  }
  state.lifelineActiveTab = tab;
  state.lifelineRemaining = seconds;
  render();
  if (lifelineIntervalId) clearInterval(lifelineIntervalId);
  lifelineIntervalId = setInterval(() => {
    state.lifelineRemaining--;
    if (state.lifelineRemaining <= 0) {
      clearInterval(lifelineIntervalId); lifelineIntervalId = null;
      finishLifeline(tab);
    } else render();
  }, 1000);
}

function finishLifeline(tab) {
  try { if (tab && !tab.closed) tab.close(); } catch (e) {}
  try { window.focus(); } catch (e) {}
  audio.lifelineEnd();
  state.lifelineActiveTab = null;
  state.lifelineActiveType = null;
  state.lifelineRemaining = 0;
  state.lifelineEnded = true;
  render();
}
function resumeAfterLifeline() {
  if (!state.lifelineEnded) return;
  state.lifelineEnded = false;
  state.timerPaused = false;
  render();
}
function cancelLifelineEarly() {
  if (lifelineIntervalId) { clearInterval(lifelineIntervalId); lifelineIntervalId = null; }
  try { if (state.lifelineActiveTab && !state.lifelineActiveTab.closed) state.lifelineActiveTab.close(); } catch (e) {}
  state.lifelineActiveTab = null; state.lifelineActiveType = null; state.lifelineRemaining = 0;
  state.timerPaused = false;
  render();
}

/* ---------- ASK THE AUDIENCE ---------- */
const AUDIENCE_VOTE_SECONDS = 10;

function useAudience() {
  if (!state.lifelines.audience || state.answerLocked || state.confirmingFinal) return;
  state.lifelines.audience = false;
  state.timerPaused = true;
  state.audienceActive = true;
  state.audienceTally = [0, 0, 0, 0];
  state.audienceVoters = [];
  audio.lifelineActivate();
  speak("Ask the audience.");

  state.audienceExpiresAt = Date.now() + AUDIENCE_VOTE_SECONDS * 1000;

  // Open voting for live viewers
  if (state.roomId && window.firebaseSync) {
    window.firebaseSync.setAudience({
      active: true,
      expiresAt: state.audienceExpiresAt,
      votes: {}
    });
    // Subscribe to audience votes
    window.firebaseSync.subscribeToAudienceVotes((votes) => {
      const v = votes || {};
      // Merge AI votes (already in state.audienceVoters) with viewer votes
      const aiVoters = state.audienceVoters.filter(x => x.isAI);
      const humanVoters = Object.values(v).map(x => ({ name: x.name, choice: x.choice, isAI: false }));
      state.audienceVoters = [...aiVoters, ...humanVoters];
      // Recompute tally from all voters
      const tally = [0,0,0,0];
      state.audienceVoters.forEach(vt => { if (typeof vt.choice === 'number') tally[vt.choice]++; });
      state.audienceTally = tally;
      render();
    });
  }

  // Schedule AI votes — spread over the 10-second window
  const correctIdx = state.currentQuestion.correct;
  const hiddenSet = new Set(state.hiddenAnswers);
  const validChoices = [0, 1, 2, 3].filter(i => !hiddenSet.has(i));

  AI_VOTER_NAMES.forEach((name, i) => {
    const accuracy = AI_VOTER_ACCURACIES[i];
    const delay = 400 + Math.random() * (AUDIENCE_VOTE_SECONDS * 1000 - 1500); // 0.4 to ~8.5s
    setTimeout(() => {
      if (!state.audienceActive) return;
      let choice;
      if (Math.random() < accuracy && validChoices.includes(correctIdx)) choice = correctIdx;
      else {
        const wrong = validChoices.filter(j => j !== correctIdx);
        choice = wrong.length > 0 ? wrong[Math.floor(Math.random() * wrong.length)] : validChoices[0];
      }
      state.audienceTally[choice]++;
      state.audienceVoters.push({ name: 'AI ' + name, choice, isAI: true });
      audio.voteBlip(0.8 + Math.random() * 0.5);
      render();
    }, delay);
  });

  // Hard timeout — auto-close after 10 seconds
  if (audienceIntervalId) clearInterval(audienceIntervalId);
  audienceIntervalId = setInterval(() => {
    const remaining = Math.max(0, Math.ceil((state.audienceExpiresAt - Date.now()) / 1000));
    state.audienceRemaining = remaining;
    if (remaining <= 0) {
      clearInterval(audienceIntervalId);
      audienceIntervalId = null;
      // Auto-close when timer hits 0
      finalizeAudienceVote();
    } else {
      render();
    }
  }, 250);

  render();
}

function finalizeAudienceVote() {
  // Lock votes, leave results displayed for player to review
  if (state.roomId && window.firebaseSync) {
    window.firebaseSync.setAudience({ active: false, expiresAt: state.audienceExpiresAt });
  }
  audio.lifelineEnd();
  // Keep audienceActive=true on host so modal stays open showing final results
  // Player closes manually with Continue button
  render();
}

function onViewerVoteUpdate(_data) {
  // Legacy callback — superseded by subscribeToAudienceVotes inside useAudience
}

function closeAudience() {
  if (!state.audienceActive) return;
  state.audienceActive = false;
  state.timerPaused = false;
  if (audienceIntervalId) { clearInterval(audienceIntervalId); audienceIntervalId = null; }
  if (state.roomId && window.firebaseSync) {
    window.firebaseSync.setAudience({ active: false });
  }
  render();
}

/* ---------- BROADCAST + INTENTS ---------- */
function buildGameStateForBroadcast() {
  // Snapshot of current game state for phones to mirror.
  // Strip non-serializable bits.
  if (!state.currentQuestion) return null;
  const currentPlayer = state.currentPlayerIdx !== null ? state.players[state.currentPlayerIdx] : null;
  return {
    currentTier: state.currentTier,
    currentQuestion: {
      q: state.currentQuestion.q,
      a: state.currentQuestion.a,
      correct: state.currentQuestion.correct,
      id: state.currentQuestion.id || null
    },
    currentPlayerViewerId: currentPlayer ? (currentPlayer.viewerId || null) : null,
    currentPlayerName: currentPlayer ? currentPlayer.name : null,
    timerRemaining: state.timerRemaining,
    timerPaused: state.timerPaused,
    timerRunning: state.timerRunning,
    selectedAnswer: state.selectedAnswer,
    answerLocked: state.answerLocked,
    revealing: state.revealing,
    hiddenAnswers: state.hiddenAnswers || [],
    lifelines: state.lifelines,
    confirmingFinal: state.confirmingFinal,
    lifelineEnded: state.lifelineEnded,
    continuePrompt: state.continuePrompt,
    activeLifeline: state.lifelineActiveType,
    safetyNetsEnabled: state.safetyNetsEnabled,
    players: state.players.map(p => ({
      name: p.name, eliminated: p.eliminated,
      correctCount: p.correctTiers.length,
      viewerId: p.viewerId
    }))
  };
}

function broadcastGameState() {
  if (!state.roomId || !window.firebaseSync || state.screen !== 'game') return;
  const gs = buildGameStateForBroadcast();
  if (gs) window.firebaseSync.setGameState(gs);
}

function setupIntentListener() {
  if (state.intentListenerSetup) return;
  if (!window.firebaseSync) return;
  window.firebaseSync.subscribeToIntents((intent, intentId) => {
    handleIntent(intent);
    window.firebaseSync.consumeIntent(intentId);
  });
  state.intentListenerSetup = true;
}

function handleIntent(intent) {
  if (!intent) return;
  // Only allow intents from the current active player
  const currentPlayer = state.currentPlayerIdx !== null ? state.players[state.currentPlayerIdx] : null;
  const fromActivePlayer = currentPlayer && currentPlayer.viewerId === intent.from;

  // For Ask the Audience, votes go through castAudienceVote, not intents
  switch (intent.type) {
    case 'select':
      if (!fromActivePlayer) return;
      selectAnswer(intent.payload.idx);
      break;
    case 'final-answer':
      if (!fromActivePlayer) return;
      // Phone wants to lock in — open the confirm flow (same as local FINAL ANSWER button)
      state.selectedAnswer = intent.payload.idx;
      openFinalConfirm();
      break;
    case 'confirm-yes':
      if (!fromActivePlayer) return;
      confirmYes();
      break;
    case 'confirm-no':
      if (!fromActivePlayer) return;
      confirmNo();
      break;
    case 'walk-away':
      if (!fromActivePlayer) return;
      endGame(false, 'walkaway');
      break;
    case 'lifeline-fifty':
      if (!fromActivePlayer) return;
      useFiftyFifty();
      break;
    case 'lifeline-google':
      if (!fromActivePlayer) return;
      useGoogleSearch();
      break;
    case 'lifeline-ai':
      if (!fromActivePlayer) return;
      useAskAI();
      break;
    case 'lifeline-audience':
      if (!fromActivePlayer) return;
      useAudience();
      break;
    case 'continue-yes':
      if (!fromActivePlayer) return;
      continueChosen();
      break;
    case 'continue-walk':
      if (!fromActivePlayer) return;
      walkAwayChosen();
      break;
    case 'resume-after-lifeline':
      if (!fromActivePlayer) return;
      resumeAfterLifeline();
      break;
  }
}

/* ---------- RENDER ---------- */
function render() {
  const app = document.getElementById('app');
  let html = '';
  if (state.screen === 'menu') html = renderMenu();
  else if (state.screen === 'modeSelect') html = renderModeSelect();
  else if (state.screen === 'teamSetup') html = renderTeamSetup();
  else if (state.screen === 'themeSelect') html = renderThemeSelect();
  else if (state.screen === 'roster') html = renderRoster();
  else if (state.screen === 'game') html = renderGame();
  else if (state.screen === 'result') html = renderResult();
  else if (state.screen === 'settings') html = renderSettings();
  else if (state.screen === 'scores') html = renderScores();
  app.innerHTML = html;
  attachEvents();
  if (state.screen === 'game' && state.mode === 'single' && !state.answerLocked && !state.confirmingFinal) saveCurrentGame();
  // Render QR codes whenever roomId is set
  if (state.roomId) renderAllQRCodes();
  // Broadcast game state to phones
  if (state.screen === 'game') broadcastGameState();
}

function renderAllQRCodes() {
  document.querySelectorAll('[data-qr-target]').forEach(el => {
    if (el.dataset.rendered === state.roomId) return;
    el.innerHTML = '';
    try {
      const base = window.location.href.replace(/index\.html.*$/, '').replace(/#.*$/, '').replace(/\?.*$/, '');
      const viewerUrl = base + (base.endsWith('/') ? '' : '/') + 'viewer.html#room=' + state.roomId;
      const size = parseInt(el.dataset.qrSize || '160', 10);
      new QRCode(el, { text: viewerUrl, width: size, height: size, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M });
      el.dataset.rendered = state.roomId;
    } catch (e) { el.innerHTML = '<div style="color:#aaa;font-size:0.8rem">QR error</div>'; }
  });
}

/* ---------- ROSTER SCREEN ---------- */
// Number of player slots required for the chosen mode
function rosterSlotCount() {
  if (state.mode === 'single') return 1;
  // For coop/versus, default to setupPlayerCount or current roster size
  return Math.max(2, state.roster.length || state.setupPlayerCount || 2);
}

function renderRoster() {
  const slots = rosterSlotCount();
  // Make sure roster array has the right length
  while (state.roster.length < slots) state.roster.push({ source: 'local', name: '', viewerId: null, slot: state.roster.length });
  while (state.roster.length > slots) state.roster.pop();

  const availableViewers = Object.values(state.lobbyViewers || {})
    .filter(v => !v.isLocal && v.connected);

  // Build a Set of viewerIds already assigned to a slot
  const usedViewerIds = new Set(state.roster.filter(r => r.source === 'viewer' && r.viewerId).map(r => r.viewerId));

  const slotRows = state.roster.map((slot, i) => {
    const sourceOptions = `
      <select data-action="roster-source" data-slot="${i}" style="padding:0.5rem;background:rgba(255,255,255,0.08);border:1px solid var(--team);color:white;border-radius:4px;font-family:Rajdhani;font-size:0.9rem">
        <option value="local" ${slot.source === 'local' ? 'selected' : ''}>Local (at PC)</option>
        <option value="viewer" ${slot.source === 'viewer' ? 'selected' : ''}>From Phone</option>
      </select>
    `;
    let inputOrPicker = '';
    if (slot.source === 'local') {
      inputOrPicker = `<input type="text" data-action="roster-name" data-slot="${i}" value="${escapeAttr(slot.name)}" placeholder="Player ${i+1} name" maxlength="20" style="flex:1;padding:0.5rem;background:rgba(255,255,255,0.08);border:1px solid var(--team);color:white;border-radius:4px;font-family:Rajdhani;font-size:0.95rem" />`;
    } else {
      const opts = availableViewers
        .filter(v => !usedViewerIds.has(v.viewerId || getViewerKey(v)) || (slot.viewerId === (v.viewerId || getViewerKey(v))))
        .map(v => {
          const vid = getViewerKey(v);
          return `<option value="${vid}" ${slot.viewerId === vid ? 'selected' : ''}>${escapeHtml(v.name)}</option>`;
        }).join('');
      inputOrPicker = `<select data-action="roster-viewer" data-slot="${i}" style="flex:1;padding:0.5rem;background:rgba(255,255,255,0.08);border:1px solid var(--team);color:white;border-radius:4px;font-family:Rajdhani;font-size:0.95rem">
        <option value="">— pick a viewer —</option>
        ${opts}
      </select>`;
    }
    return `<div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;align-items:center;flex-wrap:wrap">
      <span style="font-family:Orbitron;font-size:0.75rem;color:var(--team-glow);min-width:2.5em">P${i+1}</span>
      ${sourceOptions}
      ${inputOrPicker}
    </div>`;
  }).join('');

  // Roster validity: every slot must have a non-empty name (local) or chosen viewer (viewer)
  const valid = state.roster.every(s => {
    if (s.source === 'local') return s.name && s.name.trim().length > 0;
    if (s.source === 'viewer') return !!s.viewerId;
    return false;
  });

  // Audience preview — viewers not assigned
  const audienceCount = availableViewers.filter(v => !usedViewerIds.has(getViewerKey(v))).length;

  // Player count selector for team modes
  let countBtns = '';
  if (state.mode === 'coop' || state.mode === 'versus') {
    countBtns = `<div style="display:flex;gap:0.5rem;margin-bottom:1rem">
      ${[2,3,4].map(n => `<button class="pc-btn ${slots===n?'active':''}" data-action="roster-set-count" data-n="${n}">${n} Players</button>`).join('')}
    </div>`;
  }

  return `
    <div class="menu-screen">
      <div class="hero">
        <h1 style="font-size:clamp(1.3rem,4vw,2rem)">Pick Your Players</h1>
        <div class="sub">${modeLabelFor(state.mode)}</div>
      </div>
      <div class="setup-card" style="max-width:540px">
        <h3>Roster</h3>
        ${countBtns}
        ${slotRows}
        <div style="font-size:0.85rem;color:var(--dim);margin-top:0.6rem">
          ${availableViewers.length} viewer${availableViewers.length===1?'':'s'} connected · ${audienceCount} will be in the audience
        </div>
        <div style="margin-top:1rem;text-align:center">
          <button class="btn team" data-action="roster-confirm" ${valid?'':'disabled'}>Start Game</button>
        </div>
      </div>
      <button class="btn ghost compact" data-action="theme-select-back" style="margin-top:0.7rem">Back</button>
    </div>
  `;
}

function getViewerKey(viewer) {
  // viewer might already have viewerId on it, or we look it up by name match
  if (viewer && viewer.viewerId) return viewer.viewerId;
  for (const k in state.lobbyViewers) {
    const v = state.lobbyViewers[k];
    if (v === viewer) return k;
    if (v && viewer && v.name === viewer.name && v.lastSeen === viewer.lastSeen) return k;
  }
  return null;
}

function renderPrizeLadder() {
  let rows = '';
  for (let i = PRIZE_LADDER.length - 1; i >= 0; i--) {
    const isCurrent = i === state.currentTier;

    const isCleared = i < state.currentTier;
    const classes = ['prize-row'];
    if (isSafety) classes.push('safety');
    if (isCurrent) classes.push('current');
    if (isCleared) classes.push('cleared');
    rows += `<div class="${classes.join(' ')}"><span><span class="tier">${i+1}</span> ${isSafety?'★ ':''}</span><span>$${PRIZE_LADDER[i].toLocaleString()}</span></div>`;
  }
  return `<div class="prize-panel">${rows}</div>`;
}

      return `<div class="qr-panel" style="border-color:var(--gold)">
        <div class="title" style="color:var(--gold)">📡 Connecting to Firebase...</div>
        <div style="font-size:0.8rem;color:var(--dim);margin-top:0.4rem">Setting up viewer room...</div>
      </div>`;
    }
    if (state.firebaseStatus === 'failed') {
      return `<div class="qr-panel" style="border-color:var(--wrong)">
        <div class="title" style="color:var(--wrong-glow)">⚠️ Firebase Connection Failed</div>
        <div style="font-size:0.78rem;color:var(--dim);margin-top:0.5rem;text-align:left;line-height:1.5">
          Press <b>F12</b> to open the browser console, then look for messages starting with <b>[firebaseSync]</b>.<br><br>
          Most common causes:<br>
          • Database rules blocking writes (set to test mode in Firebase Console)<br>
          • Missing <code style="color:var(--gold)">databaseURL</code> in firebase.js<br>
          • Realtime Database not enabled (only Firestore was)
        </div>
        <div style="margin-top:0.6rem">
          <button class="btn small" data-action="firebase-debug">Show Status</button>
        </div>
      </div>`;
    }
    return '';
  }
  return `<div class="qr-panel">
    <div class="title">📱 Stream Viewers</div>
    <div id="qr-canvas" class="qr-canvas"></div>
    <div class="code">${state.roomId}</div>
    <div class="viewer-count">${state.viewerCount} viewer${state.viewerCount===1?'':'s'} connected</div>
  </div>`;
}

function renderLifelineActivePanel() {
  if (!state.lifelineActiveType) return '';
  const labels = { google: 'GOOGLE SEARCH', ai: 'ASK AI' };
  return `<div class="lifeline-active">
    <span class="label">${labels[state.lifelineActiveType]}</span>
    <span class="countdown">${state.lifelineRemaining || 0}s</span>
    <button class="btn small danger" data-action="cancel-lifeline">CANCEL</button>
  </div>`;
}

function renderTimer() {
  const warn = state.timerRemaining <= 10 && state.timerRunning && !state.timerPaused;
  const paused = state.timerPaused;
  const classes = ['timer'];
  if (warn) classes.push('warning');
  if (paused) classes.push('paused');
  return `<div class="timer-wrap"><div class="${classes.join(' ')}">${paused?'PAUSED':state.timerRemaining+'s'}</div></div>`;
}

function renderAnswers() {
  const letters = ['A','B','C','D'];
  const q = state.currentQuestion;
  if (!q) return '';
  const isLocked = state.answerLocked || state.confirmingFinal || state.lifelineEnded || state.continuePrompt || state.audienceActive;
  let html = '<div class="answers">';
  for (let i = 0; i < 4; i++) {
    const classes = ['answer'];
    if (state.hiddenAnswers.includes(i)) classes.push('hidden');
    if (!state.revealing && state.selectedAnswer === i) classes.push('selected');
    if (state.revealing) {
      if (i === q.correct) classes.push('correct');
      else if (i === state.selectedAnswer) classes.push('wrong');
    }
    if (isLocked) classes.push('locked');
    const disabled = isLocked ? 'disabled' : '';
    html += `<button class="${classes.join(' ')}" ${disabled} data-action="answer" data-idx="${i}">
      <span class="letter">${letters[i]}:</span><span class="text">${escapeHtml(q.a[i])}</span>
    </button>`;
  }
  html += '</div>';
  return html;
}

function renderLifelineButtons() {

  return `<div class="lifelines">

function renderAudienceModal() {
  if (!state.audienceActive) return '';
  const letters = ['A','B','C','D'];
  const total = state.audienceTally.reduce((a,b)=>a+b, 0);
  const bars = [0,1,2,3].filter(i => !state.hiddenAnswers.includes(i)).map(i => {
    const count = state.audienceTally[i];
    const pct = total > 0 ? Math.round((count/total)*100) : 0;
    return `<div class="audience-bar-row">
      <span class="letter">${letters[i]}</span>
      <div class="audience-bar-wrap">
        <div class="audience-bar-fill" style="width:${pct}%"></div>
        <div class="audience-bar-label">${pct}%</div>
      </div>
    </div>`;
  }).join('');
  const remaining = Math.max(0, Math.ceil((state.audienceExpiresAt - Date.now()) / 1000));
  const expectedTotal = 10 + state.viewerCount;
  const timerExpired = remaining <= 0;
  const timerHTML = timerExpired
    ? '<div class="status success" style="margin:0.7rem 0">Voting closed.</div>'
    : `<div class="audience-timer-big" style="font-family:Orbitron;font-size:2.4rem;font-weight:900;color:${remaining<=3?'var(--wrong-glow)':'var(--gold)'};text-align:center;margin:0.6rem 0">${remaining}s</div>`;

  return `<div class="overlay"><div class="modal">
    <h2>Ask the Audience</h2>
    ${timerHTML}
    <p>10 AI voters + ${state.viewerCount} live viewer${state.viewerCount===1?'':'s'} voting...</p>

function renderReplaceModal() {
  if (!state.showReplaceModal || state.replaceTargetSlot === null) return '';
  const targetPlayer = state.players[state.replaceTargetSlot];
  if (!targetPlayer) return '';

  // Pool of replacement candidates: connected viewers in audience role,
  // or eliminated players (in case host wants to bring someone back)
  const candidates = [];
  // Connected non-player viewers
  Object.values(state.lobbyViewers || {}).forEach(v => {
    if (v.isLocal) return;
    if (!v.connected) return;
    if (v.role === 'player') return; // already a player
    candidates.push({
      type: 'viewer',
      viewerId: v.viewerId,
      name: v.name,
      label: v.name + ' (audience)'
    });
  });

  const candidateList = candidates.length === 0
    ? '<p class="notice">No available replacements (no connected audience members).</p>'
    : '<div style="display:flex;flex-direction:column;gap:0.4rem;margin:0.6rem 0">' +
      candidates.map((c, i) =>
        `<button class="btn compact team" data-action="do-replace" data-cand-idx="${i}" style="text-align:left;justify-content:flex-start">
          ${escapeHtml(c.label)}
        </button>`
      ).join('') + '</div>';

  // Stash candidates on state for the action handler
  state._replaceCandidates = candidates;

  return `<div class="overlay"><div class="modal">
    <h2>Replace ${escapeHtml(targetPlayer.name)}?</h2>
    <p>Pick a replacement. The new player inherits all correct answers (${targetPlayer.correctTiers.length} so far).</p>

    </div>
  </div></div>`;
}
