<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millionaire — Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:#020814; --bg-mid:#081a3a; --bg-light:#0f2556;
    --gold:#f4c430; --gold-glow:#ffd84d; --white:#fff; --dim:#b8c4da;
    --correct:#2ecc71; --wrong:#e74c3c; --selected:#ff8c00; --selected-glow:#ffb347;
    --team:#bb6bd9; --team-glow:#d599f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Rajdhani', sans-serif;
    color: var(--white);
    background: radial-gradient(ellipse at center, var(--bg-light) 0%, var(--bg-mid) 35%, var(--bg-deep) 100%);
    background-attachment: fixed;
    min-height: 100vh; padding: 1rem;
  }
  .wrap { max-width: 500px; margin: 0 auto; padding-top: 1rem; }
  h1 {
    font-family: 'Orbitron'; font-weight: 900;
    font-size: 1.4rem; text-align: center; letter-spacing: 0.1em;
    background: linear-gradient(180deg, #fff6c9, var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 0.2rem;
  }
  .sub { font-family: 'Orbitron'; font-size: 0.7rem; text-align: center; color: var(--dim); letter-spacing: 0.3em; margin-bottom: 1rem; }
  .card {
    background: rgba(5,10,25,0.7); border: 1px solid rgba(244,196,48,0.3);
    border-radius: 8px; padding: 1.2rem; margin-bottom: 1rem;
  }
  .card h2 {
    font-family: 'Orbitron'; font-size: 0.9rem; letter-spacing: 0.15em;
    color: var(--gold); text-transform: uppercase; margin-bottom: 0.8rem;
  }
  input[type="text"] {
    width: 100%; padding: 0.8rem 1rem;
    background: rgba(255,255,255,0.08); border: 1px solid var(--gold);
    border-radius: 4px; color: white; font-family: 'Rajdhani'; font-size: 1.1rem;
    margin-bottom: 0.6rem;
  }
  input[type="text"]:focus { outline: none; border-color: var(--gold-glow); box-shadow: 0 0 12px rgba(244,196,48,0.3); }
  .btn {
    width: 100%;
    font-family: 'Orbitron'; font-weight: 700; font-size: 1rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0.9rem; border: 2px solid var(--gold);
    background: linear-gradient(180deg, rgba(244,196,48,0.15), rgba(244,196,48,0.02));
    color: var(--gold); cursor: pointer; border-radius: 4px; transition: all 0.2s;
  }
  .btn:hover:not(:disabled) {
    background: linear-gradient(180deg, rgba(244,196,48,0.3), rgba(244,196,48,0.08));
    box-shadow: 0 0 18px rgba(244,196,48,0.5);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.confirm { border-color: var(--correct); color: var(--correct); }
  .btn.confirm:hover:not(:disabled) { background: rgba(46,204,113,0.2); }
  .btn.danger { border-color: var(--wrong); color: var(--wrong); }
  .btn.danger:hover:not(:disabled) { background: rgba(231,76,60,0.2); }
  .btn.team { border-color: var(--team); color: var(--team-glow); }

  .question-text {
    font-family: 'Rajdhani'; font-weight: 600;
    font-size: 1.15rem; line-height: 1.4;
    text-align: center; padding: 0.5rem 0 1rem;
  }
  .answers { display: flex; flex-direction: column; gap: 0.5rem; }
  .answer-btn {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.9rem 1rem; border: 2px solid var(--gold);
    background: linear-gradient(90deg, rgba(15,37,86,0.8), rgba(8,26,58,0.5));
    color: white; text-align: left; cursor: pointer;
    font-family: 'Rajdhani'; font-weight: 600; font-size: 1rem;
    border-radius: 4px; transition: all 0.15s;
  }
  .answer-btn:not(:disabled):hover {
    background: linear-gradient(90deg, rgba(244,196,48,0.18), rgba(244,196,48,0.04));
    box-shadow: 0 0 12px rgba(244,196,48,0.35);
  }
  .answer-btn.picked { background: linear-gradient(90deg, rgba(255,140,0,0.4), rgba(255,140,0,0.15)); border-color: var(--selected-glow); box-shadow: 0 0 18px var(--selected); }
  .answer-btn.correct { background: linear-gradient(90deg, rgba(46,204,113,0.4), rgba(46,204,113,0.15)); border-color: var(--correct); }
  .answer-btn.wrong { background: linear-gradient(90deg, rgba(231,76,60,0.4), rgba(231,76,60,0.15)); border-color: var(--wrong); }
  .answer-btn.hidden { visibility: hidden; }
  .answer-btn:disabled { cursor: default; opacity: 0.85; }
  .answer-btn .letter { font-family: 'Orbitron'; font-weight: 900; color: var(--gold); min-width: 1.5em; }

  .status { text-align: center; padding: 0.8rem; color: var(--dim); font-size: 0.95rem; }
  .status.success { color: var(--correct); }
  .status.warn { color: var(--gold-glow); }

  .tier-badge {
    display: inline-block; background: var(--gold); color: var(--bg-deep);
    padding: 0.2rem 0.6rem; border-radius: 3px;
    font-family: 'Orbitron'; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }
  .role-badge {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 3px;
    font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 0.15em;
    margin-bottom: 0.5rem; margin-left: 0.4rem;
  }
  .role-badge.player { background: var(--team); color: white; }
  .role-badge.audience { background: rgba(244,196,48,0.2); color: var(--gold); border: 1px solid var(--gold); }
  .role-badge.active { background: var(--selected); color: white; box-shadow: 0 0 14px var(--selected); animation: pulseBadge 1s infinite alternate; }
  @keyframes pulseBadge { from { transform: scale(1); } to { transform: scale(1.04); } }

  .greeting { text-align: center; color: var(--gold-glow); font-family: 'Orbitron'; font-size: 0.85rem; letter-spacing: 0.1em; margin-bottom: 0.7rem; }
  .error { background: rgba(231,76,60,0.15); border: 1px solid var(--wrong); border-radius: 4px; padding: 0.8rem; color: #ffb3ad; font-size: 0.9rem; margin-bottom: 1rem; }

  .timer-mini { font-family: 'Orbitron'; font-weight: 900; font-size: 1.6rem; color: var(--gold); text-align: center; margin: 0.4rem 0; }
  .timer-mini.warn { color: var(--wrong); animation: pulseBadge 0.6s infinite alternate; }
  .timer-mini.paused { color: var(--dim); }

  .lifeline-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.6rem; }
  .lifeline-btn {
    display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
    padding: 0.5rem; background: rgba(5,10,25,0.7);
    border: 2px solid var(--gold); border-radius: 8px;
    color: var(--gold); font-family: 'Orbitron'; font-size: 0.65rem;
    cursor: pointer; transition: all 0.15s;
  }
  .lifeline-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(0.7); text-decoration: line-through; }
  .lifeline-btn .icon { font-size: 1.1rem; }

  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.7rem; }

  .audience-timer-big {
    font-family: 'Orbitron'; font-weight: 900; font-size: 3rem;
    text-align: center; color: var(--gold);
    text-shadow: 0 0 24px rgba(244,196,48,0.6);
    margin: 0.5rem 0;
  }
  .audience-timer-big.warn { color: var(--wrong); }

  .small-text { font-size: 0.78rem; color: var(--dim); text-align: center; margin-top: 0.4rem; }

  .player-list { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-top: 0.5rem; }
  .player-chip { background: rgba(187,107,217,0.2); border: 1px solid var(--team); color: var(--team-glow); padding: 0.2rem 0.6rem; border-radius: 50px; font-family: 'Orbitron'; font-size: 0.75rem; }
  .player-chip.eliminated { opacity: 0.4; text-decoration: line-through; }
  .player-chip.active { background: var(--selected); color: white; border-color: var(--selected-glow); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Millionaire</h1>
  <div class="sub">Live Viewer</div>
  <div id="content"></div>
</div>

<script src="firebase.js"></script>
<script>
/* ========== VIEWER LOGIC ========== */
let roomRef = null;
let myViewerId = null;
let myName = '';
let roomData = null;
let lastQuestionKey = null;
let myAnswerSelection = null; // local-only — what I'm previewing

let audienceTimerInterval = null;
let audienceCountdown = 0;

function setContent(html) { document.getElementById('content').innerHTML = html; }

function getRoomFromURL() {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  return params.get('room');
}

function escapeHtml(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- ROOM ENTRY ---------- */

function renderRoomCodeEntry() {
  setContent(`
    <div class="card">
      <h2>Enter Room Code</h2>
      <p style="color:var(--dim); margin-bottom:0.8rem; font-size:0.9rem">
        Get the 6-character code from the host's screen.
      </p>
      <input type="text" id="code-input" placeholder="ABC123" maxlength="6" autocapitalize="characters" autocomplete="off" autofocus />
      <button class="btn" id="code-btn">Continue</button>
    </div>
  `);
  const input = document.getElementById('code-input');
  const btn = document.getElementById('code-btn');
  input.addEventListener('input', () => { input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
  btn.addEventListener('click', async () => {
    const code = input.value.trim();
    if (code.length !== 6) { input.focus(); return; }
    setContent('<div class="status">Checking room...</div>');
    const exists = await window.firebaseSync.roomExists(code);
    if (!exists) {
      setContent('<div class="error">Room <b>'+code+'</b> not found. Double-check the code.</div><button class="btn" id="back">Try Again</button>');
      document.getElementById('back').addEventListener('click', renderRoomCodeEntry);
      return;
    }
    window.location.hash = '#room=' + code;
    renderNameEntry();
  });
}

function renderNameEntry() {
  const saved = localStorage.getItem('viewer_name') || '';
  setContent(`
    <div class="card">
      <h2>Enter Your Name</h2>
      <p style="color:var(--dim); margin-bottom:0.8rem; font-size:0.9rem">
        The host will see your name when picking players.
      </p>
      <input type="text" id="name-input" placeholder="Your name" value="${escapeHtml(saved)}" maxlength="20" autofocus />
      <button class="btn" id="join-btn">Join Stream</button>
    </div>
  `);
  const input = document.getElementById('name-input');
  const btn = document.getElementById('join-btn');
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
  btn.addEventListener('click', async () => {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    myName = name;
    localStorage.setItem('viewer_name', name);
    await connectToRoom();
  });
}

async function connectToRoom() {
  const roomId = getRoomFromURL();
  if (!roomId) { renderRoomCodeEntry(); return; }
  if (!window.firebaseSync.isConfigured()) {
    setContent('<div class="error">This game host hasn\'t configured Firebase. The viewer page can\'t connect.</div>');
    return;
  }
  setContent('<div class="status">Connecting to room <b>'+roomId+'</b>...</div>');
  const result = await window.firebaseSync.joinRoomAsViewer(roomId, myName);
  if (!result) {
    setContent('<div class="error">Couldn\'t join room <b>'+roomId+'</b>. Maybe the host closed it.</div>');
    return;
  }
  roomRef = result.ref;
  myViewerId = result.viewerId;
  subscribeToRoom();
}

function subscribeToRoom() {
  window.firebaseSync.subscribeToRoomFull((data) => {
    roomData = data;
    if (!data) { setContent('<div class="error">Room closed by host.</div>'); return; }
    renderFromRoomState();
  });
}

/* ---------- DETERMINE MY ROLE ---------- */
function getMe() {
  if (!roomData || !roomData.viewers) return null;
  return roomData.viewers[myViewerId] || null;
}
function isActivePlayer() {
  const me = getMe();
  if (!me || me.role !== 'player') return false;
  const game = roomData.game;
  if (!game) return false;
  // Active player either by viewer ID OR by player slot
  if (game.currentPlayerViewerId === myViewerId) return true;
  // Single-mode: only one player, always active
  if (roomData.meta && roomData.meta.mode === 'single') return true;
  return false;
}

/* ---------- MAIN RENDERER (reacts to room state) ---------- */
function renderFromRoomState() {
  const me = getMe();
  const meta = roomData.meta || {};
  const phase = meta.phase || 'lobby';

  // Reset answer selection if question changed
  const game = roomData.game;
  const qKey = game && game.currentQuestion ? game.currentQuestion.q + '-' + game.currentTier : null;
  if (qKey !== lastQuestionKey) {
    myAnswerSelection = null;
    lastQuestionKey = qKey;
  }

  // Audience countdown management
  manageAudienceTimer();

  // Routing
  if (!me) {
    setContent('<div class="error">You\'ve been removed from the room.</div>');
    return;
  }

  if (phase === 'lobby') {
    renderLobbyView(me);
  } else if (phase === 'game') {
    renderGameView(me);
  } else if (phase === 'ended') {
    renderEndedView();
  } else {
    renderLobbyView(me);
  }
}

/* ---------- LOBBY VIEW ---------- */
function renderLobbyView(me) {
  const others = Object.values(roomData.viewers || {}).filter(v => !v.isLocal);
  const list = others.map(v => `<span class="player-chip">${escapeHtml(v.name)}</span>`).join('');
  setContent(`
    <div class="greeting">Joined as ${escapeHtml(me.name)}</div>
    <div class="card">
      <div class="status warn">⏳ Waiting for the host to start the game...</div>
      <p class="small-text">The host will pick who plays. Anyone not picked will be in the audience.</p>
      <div style="margin-top:1rem">
        <div class="small-text" style="margin-bottom:0.4rem"><b>${others.length}</b> connected</div>
        <div class="player-list">${list}</div>
      </div>
    </div>
  `);
}

/* ---------- GAME VIEW ---------- */
function renderGameView(me) {
  const game = roomData.game;
  if (!game || !game.currentQuestion) {
    setContent('<div class="card"><div class="status">Game starting...</div></div>');
    return;
  }
  const isPlayer = me.role === 'player';
  const isActive = isActivePlayer();
  const audience = roomData.audience || {};
  const audienceActive = audience.active === true;
  const eliminated = me.eliminated;

  // If audience voting is active, render the voting screen for everyone (except active player who triggered it)
  if (audienceActive) {
    if (isActive) {
      // Active player who triggered it sees a watching view (not voting)
      renderActivePlayerWatchingAudience(me, game, audience);
    } else {
      renderAudienceVoteView(me, game, audience);
    }
    return;
  }

  // Active player gets interactive modals; others wait
  if (game.confirmingFinal) {
    if (isActive) renderActivePlayerFinalConfirm(me, game);
    else renderWaitingView(me, game, 'Player is confirming their answer...');
    return;
  }
  if (game.lifelineEnded) {
    if (isActive) renderActivePlayerResumeAfterLifeline(me, game);
    else renderWaitingView(me, game, 'Lifeline ended. Player is reviewing...');
    return;
  }
  if (game.continuePrompt) {
    if (isActive) renderActivePlayerContinuePrompt(me, game);
    else renderWaitingView(me, game, 'Player is deciding to continue or walk away...');
    return;
  }

  if (eliminated) {
    renderEliminatedView(me, game);
    return;
  }

  if (isPlayer && isActive) {
    renderActivePlayerView(me, game);
  } else if (isPlayer) {
    renderInactivePlayerView(me, game);
  } else {
    renderAudienceWatchingView(me, game);
  }
}

function renderQuestionBlock(game, opts = {}) {
  const letters = ['A','B','C','D'];
  const q = game.currentQuestion;
  const hidden = game.hiddenAnswers || [];
  const tappable = opts.tappable === true;
  const showResult = !!opts.showResult;
  const correctIdx = opts.correctIdx;
  const selected = opts.selected;

  const answers = q.a.map((text, i) => {
    const classes = ['answer-btn'];
    if (hidden.includes(i)) classes.push('hidden');
    if (showResult) {
      if (i === correctIdx) classes.push('correct');
      else if (i === selected) classes.push('wrong');
    } else if (selected === i) classes.push('picked');
    const disabled = (!tappable || hidden.includes(i)) ? 'disabled' : '';
    return `<button class="${classes.join(' ')}" data-idx="${i}" ${disabled}>
      <span class="letter">${letters[i]}</span><span>${escapeHtml(text)}</span>
    </button>`;
  }).join('');

  const timerClass = game.timerPaused ? 'paused' : (game.timerRemaining <= 10 ? 'warn' : '');
  const timerText = game.timerPaused ? 'PAUSED' : game.timerRemaining + 's';

  return `
    <span class="tier-badge">Q ${game.currentTier + 1} / 15</span>
    <div class="question-text">${escapeHtml(q.q)}</div>
    <div class="timer-mini ${timerClass}">${timerText}</div>
    <div class="answers">${answers}</div>
  `;
}

function renderActivePlayerView(me, game) {
  const showResult = game.revealing;
  const correctIdx = showResult ? game.currentQuestion.correct : null;
  const selected = showResult ? game.selectedAnswer : myAnswerSelection;
  const tappable = !showResult && !game.answerLocked;

  const lifelinesHTML = renderLifelinesBlock(game);
  const actionsHTML = !showResult ? `
    <div class="action-grid">
      <button class="btn confirm" id="final-btn" ${myAnswerSelection === null ? 'disabled' : ''}>FINAL ANSWER</button>
      <button class="btn danger" id="walk-btn">WALK AWAY</button>
    </div>
  ` : '';

  setContent(`
    <div class="greeting">${escapeHtml(me.name)} <span class="role-badge active">YOUR TURN</span></div>
    <div class="card">
      ${renderQuestionBlock(game, { tappable, showResult, correctIdx, selected })}
      ${lifelinesHTML}
      ${actionsHTML}
    </div>
  `);

  // Wire up answer buttons
  if (tappable) {
    document.querySelectorAll('.answer-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx, 10);
        myAnswerSelection = idx;
        window.firebaseSync.submitIntent('select', { idx });
        renderFromRoomState();
      });
    });
  }

  // Final answer — submit intent directly. Host opens confirm modal, phone mirrors with YES/NO buttons.
  const finalBtn = document.getElementById('final-btn');
  if (finalBtn) finalBtn.addEventListener('click', () => {
    if (myAnswerSelection === null) return;
    window.firebaseSync.submitIntent('final-answer', { idx: myAnswerSelection });
  });

  const walkBtn = document.getElementById('walk-btn');
  if (walkBtn) walkBtn.addEventListener('click', () => {
    if (confirm('Walk away with current winnings?')) {
      window.firebaseSync.submitIntent('walk-away');
    }
  });

  // Lifeline buttons
  document.querySelectorAll('.lifeline-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.lifeline;
      window.firebaseSync.submitIntent('lifeline-' + type);
    });
  });
}

function renderLifelinesBlock(game) {
  const ll = game.lifelines || {};
  const dis = (avail) => avail ? '' : 'disabled';
  return `<div class="lifeline-grid">
    <button class="lifeline-btn" data-lifeline="fifty" ${dis(ll.fiftyFifty)}>
      <span class="icon">⚖️</span><span>50:50</span>
    </button>
    <button class="lifeline-btn" data-lifeline="google" ${dis(ll.googleSearch)}>
      <span class="icon">🔎</span><span>GOOGLE 20s</span>
    </button>
    <button class="lifeline-btn" data-lifeline="ai" ${dis(ll.askAI)}>
      <span class="icon">🤖</span><span>ASK AI 20s</span>
    </button>
    <button class="lifeline-btn" data-lifeline="audience" ${dis(ll.audience)}>
      <span class="icon">👥</span><span>AUDIENCE</span>
    </button>
  </div>`;
}

function renderInactivePlayerView(me, game) {
  const currentName = game.currentPlayerName || 'another player';
  const showResult = game.revealing;
  const correctIdx = showResult ? game.currentQuestion.correct : null;
  const selected = showResult ? game.selectedAnswer : null;
  setContent(`
    <div class="greeting">${escapeHtml(me.name)} <span class="role-badge player">PLAYER</span></div>
    <div class="card">
      <div class="status">${escapeHtml(currentName)} is answering...</div>
      ${renderQuestionBlock(game, { tappable: false, showResult, correctIdx, selected })}
    </div>
  `);
}

function renderAudienceWatchingView(me, game) {
  const showResult = game.revealing;
  const correctIdx = showResult ? game.currentQuestion.correct : null;
  const selected = showResult ? game.selectedAnswer : null;
  const currentName = game.currentPlayerName || 'Player';
  setContent(`
    <div class="greeting">${escapeHtml(me.name)} <span class="role-badge audience">AUDIENCE</span></div>
    <div class="card">
      <div class="status">${escapeHtml(currentName)}'s turn</div>
      ${renderQuestionBlock(game, { tappable: false, showResult, correctIdx, selected })}
      <p class="small-text" style="margin-top:0.7rem">Wait for "Ask the Audience" to vote.</p>
    </div>
  `);
}

function renderAudienceVoteView(me, game, audience) {
  const myVote = audience.votes && audience.votes[myViewerId] ? audience.votes[myViewerId].choice : null;
  const canVote = myVote === null;
  const remaining = audienceCountdown;

  const letters = ['A','B','C','D'];
  const hidden = game.hiddenAnswers || [];
  const answers = game.currentQuestion.a.map((text, i) => {
    const classes = ['answer-btn'];
    if (hidden.includes(i)) classes.push('hidden');
    if (myVote === i) classes.push('picked');
    const disabled = (!canVote || hidden.includes(i)) ? 'disabled' : '';
    return `<button class="${classes.join(' ')}" data-idx="${i}" ${disabled}>
      <span class="letter">${letters[i]}</span><span>${escapeHtml(text)}</span>
    </button>`;
  }).join('');

  const statusHTML = myVote !== null
    ? `<div class="status success">✓ Vote locked: ${letters[myVote]}</div>`
    : `<div class="status warn">🗳️ Vote now!</div>`;

  setContent(`
    <div class="greeting">${escapeHtml(me.name)} <span class="role-badge audience">VOTING</span></div>
    <div class="card">
      <h2>Ask the Audience</h2>
      <div class="audience-timer-big ${remaining <= 3 ? 'warn' : ''}">${remaining}s</div>
      <div class="question-text">${escapeHtml(game.currentQuestion.q)}</div>
      <div class="answers">${answers}</div>
      ${statusHTML}
    </div>
  `);

  if (canVote) {
    document.querySelectorAll('.answer-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx, 10);
        if (hidden.includes(idx)) return;
        window.firebaseSync.castAudienceVote(idx);
      });
    });
  }
}

function renderWaitingView(me, game, msg) {
  setContent(`
    <div class="greeting">${escapeHtml(me.name)}</div>
    <div class="card">
      <div class="status">${escapeHtml(msg)}</div>
    </div>
  `);
}

function renderEliminatedView(me, game) {
  setContent(`
    <div class="greeting">${escapeHtml(me.name)} <span class="role-badge" style="background:var(--wrong);color:white">ELIMINATED</span></div>
    <div class="card">
      <div class="status">You've been eliminated. Watching the rest of the game.</div>
      ${renderQuestionBlock(game, { tappable: false })}
    </div>
  `);
}

function renderActivePlayerFinalConfirm(me, game) {
  const letters = ['A','B','C','D'];
  const idx = game.selectedAnswer;
  if (idx === null || idx === undefined) {
    renderWaitingView(me, game, 'Confirming...');
    return;
  }
  setContent(`
    <div class="greeting">${escapeHtml(me.name)} <span class="role-badge active">FINAL ANSWER?</span></div>
    <div class="card">
      <h2>Lock it in?</h2>
      <p style="text-align:center;color:var(--dim)">You selected:</p>
      <div style="font-family:Orbitron;font-size:1.2rem;font-weight:700;color:var(--selected-glow);background:rgba(255,140,0,0.15);border:1px solid var(--selected);padding:0.7rem;margin:0.7rem 0;border-radius:4px;text-align:center">
        ${letters[idx]}: ${escapeHtml(game.currentQuestion.a[idx])}
      </div>
      <p style="text-align:center;color:var(--dim)">Is that your final answer?</p>
      <div class="action-grid" style="margin-top:0.7rem">
        <button class="btn confirm" id="yes-btn">YES — LOCK IT IN</button>
        <button class="btn" id="no-btn" style="border-color:var(--dim);color:var(--dim)">NO — GO BACK</button>
      </div>
    </div>
  `);
  document.getElementById('yes-btn').addEventListener('click', () => window.firebaseSync.submitIntent('confirm-yes'));
  document.getElementById('no-btn').addEventListener('click', () => window.firebaseSync.submitIntent('confirm-no'));
}

function renderActivePlayerResumeAfterLifeline(me, game) {
  setContent(`
    <div class="greeting">${escapeHtml(me.name)} <span class="role-badge active">YOUR TURN</span></div>
    <div class="card">
      <h2>Lifeline Ended</h2>
      <p style="text-align:center">Your lifeline time is up. Tap RESUME to continue.</p>
      <p class="small-text">The question timer is paused for you.</p>
      <button class="btn confirm" id="resume-btn" style="margin-top:0.7rem">RESUME</button>
    </div>
  `);
  document.getElementById('resume-btn').addEventListener('click', () => window.firebaseSync.submitIntent('resume-after-lifeline'));
}

function renderActivePlayerContinuePrompt(me, game) {
  // The player just got the previous tier correct — game.currentTier has already advanced
  // BUT the host pauses BEFORE advancing in continue prompt mode, so currentTier is still the just-won tier
  // Actually, looking at the host code, continuePrompt is set AFTER advanceAfterCorrect would have advanced — let me just show what we know
  setContent(`
    <div class="greeting">${escapeHtml(me.name)} <span class="role-badge active">YOUR TURN</span></div>
    <div class="card">
      <h2>You're Right!</h2>
      <p style="text-align:center;color:var(--dim)">You just won this question.</p>
      <div style="background:rgba(231,76,60,0.15);border:1px solid var(--wrong);border-radius:4px;padding:0.6rem;color:#ffb3ad;font-size:0.85rem;margin:0.6rem 0;text-align:center">
        ⚠️ SAFETY NETS OFF — wrong answer next = $0
      </div>
      <p style="text-align:center">Continue or walk away?</p>
      <div class="action-grid" style="margin-top:0.7rem">
        <button class="btn confirm" id="continue-btn">CONTINUE</button>
        <button class="btn danger" id="walk-btn">WALK AWAY</button>
      </div>
    </div>
  `);
  document.getElementById('continue-btn').addEventListener('click', () => window.firebaseSync.submitIntent('continue-yes'));
  document.getElementById('walk-btn').addEventListener('click', () => window.firebaseSync.submitIntent('continue-walk'));
}

function renderActivePlayerWatchingAudience(me, game, audience) {
  // Active player triggered Ask the Audience — they wait while everyone else votes
  const remaining = audienceCountdown;
  const expired = remaining <= 0;
  setContent(`
    <div class="greeting">${escapeHtml(me.name)} <span class="role-badge active">YOUR TURN</span></div>
    <div class="card">
      <h2>Ask the Audience</h2>
      <div class="audience-timer-big ${remaining <= 3 && !expired ? 'warn' : ''}" style="${expired ? 'color:var(--correct)' : ''}">${expired ? 'CLOSED' : remaining + 's'}</div>
      <p style="text-align:center;color:var(--dim)">Audience is voting. Watch the host's screen for results.</p>
    </div>
  `);
}

function renderEndedView() {
  setContent(`
    <div class="card">
      <div class="status success">🏁 Game ended. Thanks for playing!</div>
    </div>
  `);
}

/* ---------- AUDIENCE COUNTDOWN ---------- */
function manageAudienceTimer() {
  const audience = roomData && roomData.audience;
  if (!audience || !audience.active || !audience.expiresAt) {
    if (audienceTimerInterval) { clearInterval(audienceTimerInterval); audienceTimerInterval = null; }
    audienceCountdown = 0;
    return;
  }
  // Update countdown
  const updateCountdown = () => {
    const remaining = Math.max(0, Math.ceil((audience.expiresAt - Date.now()) / 1000));
    if (remaining !== audienceCountdown) {
      audienceCountdown = remaining;
      // Re-render only this view
      if (roomData) renderFromRoomState();
    }
  };
  updateCountdown();
  if (!audienceTimerInterval) {
    audienceTimerInterval = setInterval(updateCountdown, 250);
  }
}

/* ---------- INIT ---------- */
(function init() {
  if (!window.firebaseSync.isConfigured()) {
    setContent('<div class="error">Firebase not configured by host. Viewer can\'t connect.</div>');
    return;
  }
  const room = getRoomFromURL();
  if (!room) renderRoomCodeEntry();
  else renderNameEntry();
})();
</script>
